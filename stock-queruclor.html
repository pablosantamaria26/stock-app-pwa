        try { r = rpc("qr_dev_recibir_distinto", { o: cuerpo }); }
        catch (e) { ocupado = false; return aviso("mal", "NO se guardó: " + e.message + " Volvé a tocar: no se duplica."); }
        ocupado = false;
        if (!r || !r.ok) return aviso("mal", (r && r.motivo) || "La base no aceptó la operación.");
        const pid = String(ped.pedido_id); limpiar(); cargarPedido(pid);
        aviso("ok", (r.repetida ? "Ya estaba registrado: no se repitió. " : "") + "Recibido lo que llegó; la declaración original quedó en el historial." + (emiteNota ? " Falta emitir la nota." : ""));
        if (cfg.alCambiar) try { cfg.alCambiar(r); } catch (e) {}
      }
      if (a === "nc") operar({ tipo: "nc", caso: b.dataset.caso }, "Nota emitida.");
      if (a === "nc-directo") operar({ tipo: "nc", caso: b.dataset.caso, pedido_id: b.dataset.ped }, "Nota emitida.");
      if (a === "ver-nota") {
        if (global.NotaCreditoDoc) NotaCreditoDoc.ver(b.dataset.nc);
        else aviso("info", "La nota " + b.dataset.nc + " se ve en Caja › Queruclor.");
      }
      if (a === "avisos" && "Notification" in global) Notification.requestPermission().then(() => pintar());
      if (a === "liberar" || a === "descartar") {
        const motivo = prompt(a === "liberar" ? "¿Por qué vuelve a la venta? (ej.: la caja está sana)" : "¿Por qué se descarta? (ej.: producto roto)");
        if (!motivo || !motivo.trim()) return;
        let r;
        try { r = rpc("qr_revisar_resolver", { p_mov: b.dataset.mov, p_accion: a, p_motivo: motivo.trim(), p_quien: quien() }); }
        catch (x) { return aviso("mal", "NO se guardó: " + x.message); }
        aviso(r && r.ok ? "ok" : "mal", r && r.ok ? (a === "liberar" ? "Volvió a la venta." : "Descartado.") : (r && r.motivo) || "No se pudo.");
      }
    }
    raiz.addEventListener("change", e => {
      const t = e.target;
      if (t.classList.contains("dv-sana")) {
        const c = cajas[+t.dataset.i];
        c.sana = t.value !== "0"; c.reacondicionada = t.value === "2";
        if (c.reacondicionada && c.unidades == null) { const a = (ped.articulos || []).find(x => x.ean === c.ean); c.unidades = a ? a.uc : null; }
        return pintar();
      }
      if (t.classList.contains("dv-reac-u")) { cajas[+t.dataset.i].unidades = t.value === "" ? null : Math.max(0, Math.floor(Number(t.value) || 0)); return; }
      if (t.classList.contains("dv-reac-sd")) { cajas[+t.dataset.i].sinDanio = t.checked; return; }
      if (t.id === "dvMotivo") { sinCod.motivo = t.value; pintar(); return; }
      if (t.id === "dvMotivoOtro") { sinCod.otro = t.value; return; }
      if (t.dataset.ean && t.dataset.k) {
        /* 20/10/2026: redibujar al salir del campo se comía el clic en «Confirmar recepción» (había que tocar
           dos veces). La cantidad ya se guardó al escribir (evento «input»): acá no se redibuja. */
        const m = manual[t.dataset.ean] = manual[t.dataset.ean] || { cajas: 0, sueltas: 0, sana: true };
        if (t.dataset.k === "sana") { m.sana = t.value === "1"; pintar(); }
        else m[t.dataset.k] = Math.max(0, Math.floor(Number(t.value) || 0));
      }
    });
    raiz.addEventListener("input", e => {
      const t = e.target;
      if (t.id === "dvMotivoOtro") sinCod.otro = t.value;
      if (t.id === "dvMotivoDif") motivoDif = t.value;
      if (t.dataset && t.dataset.ean && (t.dataset.k === "cajas" || t.dataset.k === "sueltas")) {
        const m = manual[t.dataset.ean] = manual[t.dataset.ean] || { cajas: 0, sueltas: 0, sana: true };
        m[t.dataset.k] = Math.max(0, Math.floor(Number(t.value) || 0));
        /* El botón se actualiza en el lugar: redibujar acá cortaría lo que se está escribiendo. */
        const n = itemsActuales().length, b = raiz.querySelector("button.dv-b.prim[data-a='recibir']");
        if (b) { b.disabled = !n; b.textContent = "Confirmar recepción" + (n ? " (" + n + ")" : ""); }
      }
    });

    /* Cámara del celular (Chrome Android pide https). */
    let parar = null;
    async function camara() {
      if (parar) { parar(); parar = null; return; }
      const v = raiz.querySelector("#dvVideo");
      try {
        const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        v.srcObject = st; v.hidden = false; await v.play();
        const det = new BarcodeDetector({ formats: ["code_128", "qr_code", "ean_13", "itf", "code_39"] });
        let vivo = true, ultimo = "";
        parar = () => { vivo = false; st.getTracks().forEach(t => t.stop()); v.hidden = true; };
        const ciclo = async () => {
          if (!vivo) return;
          try { const cs = await det.detect(v); const c = cs[0] && cs[0].rawValue; if (c && c !== ultimo) { ultimo = c; escanear(c, "camara"); } } catch (e) {}
          setTimeout(ciclo, 250);
        };
        ciclo();
      } catch (e) { aviso("mal", "No se pudo usar la cámara: " + e.message); }
    }

    /* Lo que hacen otros equipos aparece solo, pero NUNCA mientras la
       persona está tocando o tiene cajas cargadas sin confirmar: redibujar
       en ese momento le robaba el clic (el botón se reemplazaba entre el
       «apretar» y el «soltar») o le borraba lo que estaba escribiendo. */
    /* Y nunca con el mouse encima: si la lista se reordena bajo el cursor,
       el clic cae en la nota de OTRO cliente. */
    let ultimoToque = 0, diferido = null;
    /* Se pregunta al navegador en el momento (no con un indicador propio,
       que quedaba trabado si la lista se redibujaba bajo el cursor). */
    const encimaAhora = () => { try { return raiz.matches(":hover"); } catch (e) { return false; } };
    ["pointerdown", "keydown", "input", "pointermove"].forEach(t => raiz.addEventListener(t, () => { ultimoToque = Date.now(); }, true));
    ["keydown", "input", "change"].forEach(t => raiz.addEventListener(t, () => { refrescadoAfuera = 0; }, true));
    raiz.addEventListener("pointerleave", () => { if (pendiente) setTimeout(() => refrescarDeAfuera(false), 50); });
    /* Aviso «hay novedades». Flotando abajo tapaba «Confirmar lo que llegó» (Stock, 18/10/2026) y
       «Emitir nota» (Caja); arriba de la lista corría todo hacia abajo justo cuando se tocaba el campo
       del código y el clic caía en el aviso. 25/10/2026: va en la fila del código, a la derecha, en
       los tres puestos: aparece sin mover nada de lugar (`cfg.novedadEnLinea` ya no cambia nada). */
    let pendiente = false, pillOn = false;
    const pill = {
      get hidden() { return !pillOn; },
      set hidden(v) { pillOn = !v; const nb = raiz.querySelector(".dv-nov"); if (nb) nb.hidden = !!v; },
    };
    const ocupadoUsuario = () => encimaAhora() || Date.now() - ultimoToque < 2500 || cajas.length > 0 || Object.keys(manual).some(k => manual[k].cajas || manual[k].sueltas)
      || (document.activeElement && raiz.contains(document.activeElement) && document.activeElement.id !== "dvCod");
    function refrescarDeAfuera(forzar) {
      if (!raiz.offsetParent) { pill.hidden = true; pendiente = true; return; }
      if (document.hidden || ocupado) { pendiente = true; return; }
      if (!forzar && ocupadoUsuario()) {
        pendiente = true; pill.hidden = false;
        clearTimeout(diferido); diferido = setTimeout(() => refrescarDeAfuera(false), 2500); return;
      }
      pendiente = false; pill.hidden = true;
      if (ped) cargarPedido(ped.pedido_id);
      refrescadoAfuera = Date.now();
      pintar();
    }
    if (S.escuchar) S.escuchar(["qr_devoluciones", "qr_stock"], () => refrescarDeAfuera(false));
    /* Lo que pasó con la pestaña oculta o en otra sección, aparece al volver. */
    document.addEventListener("visibilitychange", () => { if (!document.hidden && pendiente) refrescarDeAfuera(false); });
    pintar();
    /* Volver a la sección: si hubo novedades mientras no se veía, se traen. */
    const alVolver = () => { if (ped) cargarPedido(ped.pedido_id); pendiente = false; pintar(); };
    return { escanear, abrirPedido, pintar: alVolver, estado: () => ({ ped, cajas, manual, op, vista, sinCod }) };
  }

  /* ── La misma pantalla en una ventana, sin salir de lo que se está
     haciendo (Facturación: «Devoluciones» sin perder el pedido abierto). ── */
  const ventanas = {};
  function abrir(cfg) {
    let v = ventanas[cfg.modo];
    if (!v) {
      const ov = document.createElement("div");
      ov.className = "dv-ov"; ov.id = "dvOv-" + cfg.modo; ov.hidden = true;
      ov.innerHTML = `<div class="dv-ventana" role="dialog" aria-modal="true" aria-label="Devoluciones">
          <div class="dv-ventana-h"><b>Devoluciones</b><span>Recibir cajas y emitir notas · lo mismo que ven Stock y Caja</span>
            <button type="button" class="dv-b" data-cerrar>Cerrar</button></div>
          <div class="dv-ventana-c"><div class="dv-raiz"></div></div></div>`;
      document.body.appendChild(ov);
      const cerrar = () => { ov.hidden = true; if (cfg.alCerrar) try { cfg.alCerrar(); } catch (e) {} };
      ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-cerrar]")) cerrar(); });
      document.addEventListener("keydown", e => { if (e.key === "Escape" && !ov.hidden) cerrar(); });
      v = ventanas[cfg.modo] = { ov, inst: montar(ov.querySelector(".dv-raiz"), Object.assign({ novedadEnLinea: true }, cfg)) };
    }
    v.ov.hidden = false;

<script>
/* ═══════════════════════════════════════════════════════════════════
   PANTALLA DE STOCK — la que usa el depósito desde el celular o la PC

   18/10/2026: tres tareas claras, una a la vez:
     · RECIBIR DEL PROVEEDOR → suma al stock lo que llegó con un remito.
     · CONTAR DEPÓSITO       → una sesión de conteo (se guarda y se retoma).
     · RECIBIR DEVOLUCIÓN    → la misma pantalla que Caja (devoluciones-ui.js).
   Arriba siempre: la tarea activa, el operario (elegido, no es una
   contraseña) y el estado REAL de guardado. Identificar un artículo no
   mueve stock: solo lo muestra.

   Entrada única de artículos: cámara, lector USB/Bluetooth (escribe como
   un teclado y manda Enter), código escrito o pegado, o búsqueda por
   nombre. Todo pasa por la misma resolución (StockEscaner.identificar).
   ═══════════════════════════════════════════════════════════════════ */
(function () {

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  const E = window.StockEscaner;
  const enBase = () => !!(window.QR_LOCAL && window.QRSrv);
  const TAREAS = ["recibir", "contar", "devol"];
  let tarea = localStorage.getItem("qr_stock_tarea") ||
    (localStorage.getItem("qr_stock_modo") === "contar" ? "contar" : "recibir");
  if (!TAREAS.includes(tarea)) tarea = "recibir";
  let vista = tarea;                 // tarea o consulta (stock / movs)
  let cerrarCamara = null;
  let devol = null;
  const sesion = [];                 // lo recibido en esta pasada
  let ocupado = false;               // una confirmación a la vez (doble toque)

  /* ── Estado real de guardado y conexión ───────────────────────── */
  function estado(clase, txt) {
    const el = $("estadoGuardado"); if (!el) return;
    el.className = "estado " + (clase || ""); el.textContent = txt;
  }
  /* Ejecuta una escritura y muestra lo que de verdad pasó. Las llamadas a
     la base son sincrónicas: si devuelve, la base respondió. */
  function guardar(fn) {
    estado("guardando", "Guardando…");
    try { const r = fn(); estado("guardado", "Guardado"); return r; }
    catch (e) { estado("error", "No se guardó: sin conexión"); throw e; }
  }
  window.addEventListener("offline", () => estado("error", "Sin conexión"));
  window.addEventListener("online", () => estado("", "Conectado"));

  /* ── Quién ────────────────────────────────────────────────────── */
  function pedirQuien() {
    $("quienOverlay").style.display = "flex";
    $("quienBotones").innerHTML = E.OPERARIOS.map(n =>
      `<button class="op-btn" data-n="${esc(n)}">${esc(n)}</button>`).join("");
    $("quienBotones").querySelectorAll(".op-btn").forEach(b => {
      b.onclick = () => { E.setQuien(b.dataset.n); $("quienOverlay").style.display = "none"; pintarQuien(); };
    });
  }
  function pintarQuien() {
    const q = E.quien();
    $("quienActual").textContent = q ? "Operario: " + q : "Elegí operario";
    if (!q) pedirQuien();
    return q;
  }

  /* ── Catálogo: foto y búsqueda por nombre ─────────────────────── */
  const productos = () => ((window.CATALOGO_BASE && CATALOGO_BASE.productos) || []);
  const fotoDe = p => (p && p.imagen) || (p && p.ean ? (window.qrFotoUrl ? qrFotoUrl(p.ean) : p.ean + ".jpg") : "");
  const prodDe = ean => productos().find(p => String(p.ean) === String(ean)) || null;
  function buscarNombre(q) {
    const t = norm(q).split(/\s+/).filter(Boolean);
    if (!t.length) return [];
    return productos().filter(p => { const n = norm(p.nombreCompleto + " " + (p.marca || "")); return t.every(x => n.includes(x)); }).slice(0, 8);
  }
  function fichaDe(p, tipo) {
    const uc = Number(p.uc) || 1;
    return { ean: String(p.ean), dun: p.dun || "", uc, nombre: p.nombreCompleto || p.ean, marca: p.marca || "",
      tipo: uc === 1 ? "caja" : (tipo || "caja"), unoPorCaja: uc === 1, imagen: fotoDe(p), porNombre: true };
  }

  /* ── Tareas ───────────────────────────────────────────────────── */
  const AYUDA = {
    recibir: "Cargás lo que llegó del proveedor con su remito: el sistema lo SUMA al stock.",
    contar: "Contás lo que hay en el depósito en una sesión: se guarda y se retoma. «No contado» no es cero.",
    devol: "Una caja que vuelve de un cliente: escaneá su etiqueta (ML-…). Lo sano vuelve a la venta; lo abierto o dañado, «a revisar».",
  };
  function setTarea(t) {
    if (TAREAS.includes(t)) { tarea = t; localStorage.setItem("qr_stock_tarea", t); }
    vista = t;
    TAREAS.forEach(x => { const b = $("t-" + x); if (b) { b.classList.toggle("on", x === t); b.setAttribute("aria-pressed", x === t); } });
    ["stock", "movs"].forEach(x => $("t-" + x).classList.toggle("on", x === t));
    document.body.classList.toggle("modo-recibir", t === "recibir");
    document.body.classList.toggle("modo-devol", t === "devol");
    $("ayudaModo").textContent = AYUDA[t] || (t === "stock" ? "Consulta: nada se modifica acá." : "Historial de movimientos.");
    const conEntrada = t === "recibir" || t === "contar";
    $("entrada").style.display = conEntrada ? "" : "none";
    $("remitoWrap").style.display = t === "recibir" ? "" : "none";
    ["recibir", "contar", "devol", "stock", "movs"].forEach(x => { $("v-" + x).style.display = x === t ? "" : "none"; });
    $("sugerencias").innerHTML = "";
    if (!conEntrada) apagarCamara();
    if (t === "recibir") limpiar();
    if (t === "contar") pintarConteo();
    if (t === "stock") pintarStock();
    if (t === "movs") pintarMovs();
    if (t === "devol" && window.DevUI && !devol) devol = DevUI.montar($("v-devol"), { modo: "stock", quien: () => E.quien(), novedadEnLinea: true });
    else if (t === "devol" && devol) devol.pintar();
    if (conEntrada) setTimeout(() => { const m = $("manual"); if (m && document.activeElement !== m && !$("quienOverlay").style.display.includes("flex")) m.focus(); }, 0);
  }

  /* ── Entrada única ────────────────────────────────────────────── */
  function procesarEntrada(txt, origen) {
    const t = String(txt || "").trim();
    if (!t) return;
    E.tocarQuien();
    $("sugerencias").innerHTML = "";
    /* La etiqueta interna de una caja despachada NO es un código de artículo. */
    if (/^ML-\d+(-\d+)?$/i.test(t)) {
      if (tarea === "devol" && devol) return devol.escanear(t);
      if (tarea === "contar") return etiquetaEnConteo(t);
      $("resultado").innerHTML = `<div class="card err"><div class="err-t">Es la etiqueta de una caja despachada</div>
        <div class="err-c">${esc(t)}</div><div class="err-s">Identifica una caja que salió a un cliente, no un artículo del proveedor.
        Si esa caja volvió, se recibe en «Recibir devolución».</div>
        <div class="dupe-acc"><button class="ghost" id="etqNo">Volver</button><button class="ok" id="etqDev">Ir a Recibir devolución</button></div></div>`;
      if (tarea === "contar") { $("conteo").insertAdjacentHTML("afterbegin", $("resultado").innerHTML); $("resultado").innerHTML = ""; }
      const ir = $("etqDev"), no = $("etqNo");
      if (ir) ir.onclick = () => { setTarea("devol"); if (devol) devol.escanear(t); };
      if (no) no.onclick = () => (tarea === "contar" ? pintarConteo() : limpiar());
      return;
    }
    if (/^\d{8,14}$/.test(t.replace(/\D/g, "")) && /^[\d\s-]+$/.test(t)) {
      const ficha = E.identificar(t);
      if (!ficha) return noReconocido(t, false, E.malLeido(t));
      if (ficha.tipo === "ambiguo") return pintarAmbiguo(t, ficha.opciones, origen);
      const p = prodDe(ficha.ean);
      return elegir(Object.assign({}, ficha, { imagen: fotoDe(p), unoPorCaja: ficha.uc === 1, leido: t, origen }));
    }
    /* Texto: búsqueda por nombre (con una sola coincidencia, Enter la elige). */
    const l = buscarNombre(t);
    if (!l.length) return noReconocido(t, true);
    if (l.length === 1 && origen === "enter") return elegirProducto(l[0]);
    pintarSugerencias(l);
  }
  /* Una etiqueta ML- leída al contar: decide el ESTADO de esa caja (devuelta y reintegrada se cuenta; facturada o preparada, no). */
  function etiquetaEnConteo(t) {
    let r = null;
    try { r = QRSrv.rpc("qr_conteo_etiqueta", { p_codigo: t }); } catch (e) {}
    const p = r && r.contar && r.ean ? prodDe(r.ean) : null;
    const titulo = !r ? "No se pudo consultar esa etiqueta (sin conexión)" : r.contar === true ? "Esta caja SE CUENTA" : r.contar === false ? "Esta caja NO se cuenta" : "Etiqueta no registrada";
    const clase = r && r.contar === true ? "ok" : "err";
    $("conteo").insertAdjacentHTML("afterbegin", `<div class="card ${clase}" id="etqConteo"><div class="err-t">${esc(titulo)}</div>
      <div class="err-c">${esc(t)}${r && r.nombre ? " · " + esc(r.nombre) : ""}</div>
      <div class="err-s">${esc(r ? r.motivo : "Revisá la conexión y volvé a leerla. No se registró nada.")}</div>
      <div class="dupe-acc"><button class="ghost" id="etqNo">Volver</button>${p ? `<button class="ok" id="etqContar">Contar este artículo</button>` : ""}</div></div>`);
    const no = $("etqNo"), si = $("etqContar");
    if (no) no.onclick = () => pintarConteo();
    if (si) si.onclick = () => { const c = $("etqConteo"); if (c) c.remove(); elegir(Object.assign(fichaDe(p, "caja"), { leido: t })); };
  }
  function pintarSugerencias(l) {
    $("sugerencias").innerHTML = l.map((p, i) => `<button type="button" role="option" data-i="${i}">
      <img src="${esc(fotoDe(p))}" alt="" onerror="this.style.visibility='hidden'">
      <span><b>${esc(p.nombreCompleto)}</b><small>${esc(p.marca || "")} · caja x ${esc(p.uc)} · ${esc(p.ean)}</small></span></button>`).join("");
    $("sugerencias").querySelectorAll("button").forEach(b => { b.onclick = () => elegirProducto(l[+b.dataset.i]); });
  }
  function elegirProducto(p) { $("sugerencias").innerHTML = ""; $("manual").value = ""; elegir(fichaDe(p)); }
  function noReconocido(t, nombre, malLeido) {
    const html = `<div class="card err"><div class="err-t">${nombre ? "No encontré ese nombre" : malLeido ? "El código no se leyó bien" : "Código no reconocido"}</div>
      <div class="err-c">${esc(t)}</div><div class="err-s">${nombre ? "Probá con otra palabra del nombre o con el código de barras."
      : malLeido ? "No es un código válido (falla el dígito de control): seguramente se leyó mal. Probá de nuevo."
      : "No está en la lista de Queruclor. Probá buscarlo por nombre; si es un artículo nuevo, se carga primero en el Admin."}</div></div>`;
    if (tarea === "contar") { pintarConteo(); $("conteo").insertAdjacentHTML("afterbegin", html); } else $("resultado").innerHTML = html;
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  }
  /* Un código que corresponde a más de una presentación: se elige, nunca se asigna por parecido. */
  function pintarAmbiguo(t, opciones, origen) {
    const html = `<div class="card err"><div class="err-t">Ese código corresponde a más de un artículo</div>
      <div class="err-c">${esc(t)}</div>
      <div class="err-s">No se asigna por parecido: elegí cuál es, o avisá a Administración para corregir el catálogo.</div>
      <div class="amb-op">${opciones.map((o, i) => `<button type="button" data-i="${i}">${esc(o.nombre)}<small>${esc(o.marca || "")} · ${o.tipo === "caja" ? "caja" : "unidad"} · caja x ${esc(o.uc)}</small></button>`).join("")}</div></div>`;
    if (tarea === "contar") { pintarConteo(); $("conteo").insertAdjacentHTML("afterbegin", html); } else $("resultado").innerHTML = html;
    const cont = tarea === "contar" ? $("conteo") : $("resultado");
    cont.querySelectorAll(".amb-op button").forEach((b, i) => { b.onclick = () => { const o = opciones[i]; const p = prodDe(o.ean); elegir(Object.assign({}, o, { imagen: fotoDe(p), unoPorCaja: o.uc === 1, leido: t, origen })); }; });
  }
  function elegir(f) {
    if (navigator.vibrate) navigator.vibrate(35);
    if (tarea === "contar") return abrirConteoArticulo(f.ean, f);
    pintarRecepcion(f);
  }

  /* El lector HID escribe en el campo que tenga el foco. Si por error el
     foco está en una cantidad o en el remito, una ráfaga de dígitos + Enter
     (más rápida que una persona) se devuelve al buscador y el campo queda
     como estaba. */
  const rafaga = new WeakMap();
  document.addEventListener("keydown", e => {
    const el = e.target;
    if (!el || el.tagName !== "INPUT" || el.id === "manual") return;
    const ahora = performance.now();
    let st = rafaga.get(el);
    if (/^\d$/.test(e.key)) {
      if (!st || ahora - st.ult > 60) st = { ini: el.value, buf: "", ult: ahora, rapidas: 0 };
      else st.rapidas++;
      st.buf += e.key; st.ult = ahora; rafaga.set(el, st);
      return;
    }
    if (e.key === "Enter" && st && st.buf.length >= 8 && st.rapidas >= st.buf.length - 2 && ahora - st.ult < 80) {
      e.preventDefault(); e.stopImmediatePropagation();
      const cod = st.buf; el.value = st.ini; rafaga.delete(el);
      if (el.tagName === "INPUT") el.dispatchEvent(new Event("input", { bubbles: true }));
      procesarEntrada(cod, "lector");
      return;
    }
    if (e.key !== "Shift") rafaga.delete(el);
  }, true);

  /* ── Cámara ───────────────────────────────────────────────────── */
  function apagarCamara() {
    if (cerrarCamara) { try { cerrarCamara(); } catch (e) {} cerrarCamara = null; }
    if ($("video")) $("video").style.display = "none";
    if ($("camBtn") && !$("camBtn").disabled) $("camBtn").textContent = "📷 Prender la cámara";
  }
  function prepararCamara() {
    const b = $("camBtn"), nota = $("camNota");
    const seguro = window.isSecureContext || location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if (!seguro) { b.disabled = true; b.textContent = "La cámara necesita la dirección https"; nota.textContent = "Abrí la app con la dirección https://… que muestra la portada, o usá el lector o el código."; return; }
    if (!E.hayCamara()) { b.disabled = true; b.textContent = "La cámara no está disponible en este equipo"; nota.textContent = "Usá el lector USB/Bluetooth, escribí el código o buscá por nombre."; return; }
    b.onclick = async () => {
      if (cerrarCamara) return apagarCamara();
      let pista = null;
      try {
        $("video").style.display = "";
        cerrarCamara = await E.abrirCamara($("video"), c => { clearTimeout(pista); procesarEntrada(c, "camara"); });
        b.textContent = "✕ Apagar la cámara";
        nota.textContent = "Apuntá al código de barras. Si no lo lee, acercalo, mejorá la luz o escribilo.";
        pista = setTimeout(() => { if (cerrarCamara) nota.textContent = "¿No lo lee? Puede estar borroso o dañado: escribí el código o buscá por nombre."; }, 9000);
      } catch (err) {
        apagarCamara();
        const n = err && err.name;
        const msg = n === "NotAllowedError" ? "Sin permiso para la cámara: habilitalo en el navegador, o usá el lector o el código."
          : n === "NotFoundError" || n === "OverconstrainedError" ? "No se encontró una cámara en este equipo."
          : n === "NotReadableError" ? "La cámara la está usando otra aplicación."
          : (err && err.message) || "No se pudo abrir la cámara";
        nota.textContent = msg; aviso(msg, "err");
      }
    };
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden) apagarCamara(); });
  window.addEventListener("pagehide", apagarCamara);

  /* ── Recibir del proveedor ────────────────────────────────────── */
  function pintarRecepcion(f) {
    const fis = Stock.fisico(f.ean);
    let unidad = f.tipo === "caja" ? "cajas" : "unidades";
    $("resultado").innerHTML = `
      <div class="card ${unidad === "cajas" ? "es-caja" : "es-unidad"}">
        <div class="ficha">
          <img class="ficha-foto" src="${esc(f.imagen || "")}" alt="" onerror="this.style.visibility='hidden'">
          <div style="flex:1;min-width:0">
            <div class="tipo" id="recTipo"></div>
            <div class="nom">${esc(f.nombre)}</div>
            <div class="meta">${esc(f.marca)} · caja x ${f.uc}${f.unoPorCaja ? " (la bolsa es la caja)" : ""}
              ${f.leido ? ` · leído <span class="cod">${esc(f.leido)}</span>` : ""}</div>
          </div>
        </div>
        <div class="hoy-tit">Stock actual (antes de sumar esto)</div>
        <div class="hoy"><div><span>${fis.cajas}</span><small>cajas</small></div><div><span>${fis.sueltas}</span><small>sueltas</small></div></div>
        ${f.uc > 1 ? `<div class="cnt-tabs" role="radiogroup" aria-label="Unidad"><button type="button" data-u="cajas">Cajas</button><button type="button" data-u="unidades">Unidades sueltas</button></div>` : ""}
        <label class="lbl" for="qty" id="recLbl"></label>
        <div class="cant"><button id="menos" aria-label="Menos">−</button>
          <input id="qty" type="number" inputmode="numeric" min="1" value="1"><button id="mas" aria-label="Más">+</button></div>
        <div class="equiv" id="recEquiv"></div>
        <button class="ok" id="aplicar"></button>
      </div>`;
    const qty = $("qty");
    const pintar = () => {
      const n = Math.max(0, Math.floor(+qty.value || 0));
      $("recTipo").textContent = unidad === "cajas" ? "📦 CAJA CERRADA" : "🧴 UNIDAD SUELTA";
      $("recLbl").textContent = unidad === "cajas" ? "¿Cuántas CAJAS entraron?" : "¿Cuántas UNIDADES SUELTAS entraron?";
      $("recEquiv").textContent = unidad === "cajas"
        ? `Entran ${n} caja${n === 1 ? "" : "s"} × ${f.uc} = ${n * f.uc} unidad${n * f.uc === 1 ? "" : "es"}`
        : `Entran ${n} unidad${n === 1 ? "" : "es"} sueltas (no completan cajas)`;
      $("aplicar").textContent = `✓ Confirmar ingreso: ${n} ${unidad === "cajas" ? (n === 1 ? "caja" : "cajas") : (n === 1 ? "unidad" : "unidades")}` + (unidad === "cajas" ? ` (${n * f.uc} un.)` : "");
      document.querySelectorAll("#resultado [data-u]").forEach(b => b.classList.toggle("on", b.dataset.u === unidad));
    };
    document.querySelectorAll("#resultado [data-u]").forEach(b => { b.onclick = () => { unidad = b.dataset.u; pintar(); }; });
    qty.oninput = pintar;
    $("menos").onclick = () => { qty.value = Math.max(1, (+qty.value || 0) - 1); pintar(); };
    $("mas").onclick = () => { qty.value = (+qty.value || 0) + 1; pintar(); };
    const ir = () => aplicarRecepcion(f, Math.max(0, Math.floor(+qty.value || 0)), unidad);
    $("aplicar").onclick = ir;
    qty.onkeydown = e => { if (e.key === "Enter") ir(); };
    pintar();
    qty.focus(); qty.select();
  }

  function aplicarRecepcion(f, cantidad, unidad, forzar) {
    if (ocupado) return;
    const q = E.quien();
    if (!q) return pedirQuien();
    if (!(cantidad > 0)) return aviso("Poné cuántas entraron", "err");
    const remito = ($("remito").value || "").trim();
    if (!remito) { $("remito").focus(); return aviso("Poné el número de remito antes de cargar", "err"); }
    const cajas = unidad === "cajas" ? cantidad : 0, sueltas = unidad === "cajas" ? 0 : cantidad;
    ocupado = true;
    let r;
    try {
      r = guardar(() => Stock.recibir({ ean: f.ean, cajas, sueltas, remito, quien: q,
        id: forzar ? ("rec|" + remito + "|" + f.ean + "|" + Date.now()) : undefined }));
    } catch (e) { ocupado = false; return aviso("NO se guardó: " + e.message + " Volvé a tocar cuando haya conexión (no se duplica).", "err"); }
    ocupado = false;
    if (!r.ok && r.razon === "duplicado") return dupe(f, cantidad, unidad, remito);
    if (!r.ok) return aviso("No se pudo aplicar: " + (r.razon || "error"), "err");
    sesion.unshift({ nombre: f.nombre, unidad, cantidad, hora: new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }) });
    pintarSesion();
    aviso("Sumado: " + cantidad + (unidad === "cajas" ? " cajas" : " unidades"), "ok");
    limpiar();
  }

  /* El mismo artículo con el mismo remito dos veces: casi siempre un doble
     toque; a veces el remito lo trae en dos renglones (se puede forzar). */
  function dupe(f, cantidad, unidad, remito) {
    $("resultado").innerHTML = `
      <div class="card err">
        <div class="err-t">Ya cargaste este artículo con el remito ${esc(remito)}</div>
        <div class="err-s">Si lo tocaste dos veces, está todo bien: no se sumó de nuevo.
          Si el remito lo trae en dos renglones, podés sumarlo igual.</div>
        <div class="dupe-acc"><button class="ghost" id="dupeNo">Está bien así</button>
          <button class="ok" id="dupeSi">Sumar igual ${cantidad}</button></div>
      </div>`;
    $("dupeNo").onclick = limpiar;
    $("dupeSi").onclick = () => aplicarRecepcion(f, cantidad, unidad, true);
  }

  function limpiar() { $("resultado").innerHTML = ""; }
  function aviso(txt, tipo) {
    const t = $("toast");
    t.textContent = txt; t.className = "toast ver " + (tipo || "");
    clearTimeout(aviso._t); aviso._t = setTimeout(() => { t.className = "toast"; }, 3200);
  }
  function pintarSesion() {
    if (!sesion.length) { $("sesion").innerHTML = ""; return; }
    $("sesion").innerHTML = `<div class="ses-t">Recibido en esta pasada · ${sesion.length}</div>` +
      sesion.slice(0, 12).map(s => `<div class="ses-i"><span class="ses-c">+${s.cantidad}</span><span class="ses-n">${esc(s.nombre)}</span>
        <span class="ses-u">${s.unidad === "cajas" ? "cajas" : "un."}</span><span class="ses-h">${s.hora}</span></div>`).join("");
  }

  /* ── Contar depósito (sesión en la base compartida) ───────────── */
  let cnt = null, cntVista = "pendientes", cntOp = null, cntFin = null, cntCierre = null;
  const rpc = (fn, a) => QRSrv.rpc(fn, a);
  function leerConteo() {
    const abiertas = QRSrv.get("qr_conteos", "estado=eq.abierto&order=creado.asc&limit=1", 0) || [];
    cnt = abiertas.length ? rpc("qr_conteo_estado", { p_sesion: abiertas[0].id }) : null;
    return cnt;
  }
  const qtxt = (c, s, uc) => uc === 1 ? `${c} un.` : `${c} caja${c === 1 ? "" : "s"}${s ? " + " + s + " un." : ""}`;
  function pintarConteo() {
    if (cntCierre) return pintarCierreConteo();
    if (!enBase()) {
      $("conteo").innerHTML = `<div class="aviso-lindo">El conteo por sesiones necesita conexión con el servidor.</div>`;
      return;
    }
    try { leerConteo(); } catch (e) { estado("error", "Sin conexión"); $("conteo").innerHTML = `<div class="card err"><div class="err-t">Sin conexión</div><div class="err-s">No se puede leer el conteo ahora. Lo que ya guardaste está en el servidor.</div></div>`; return; }
    if (!cnt) {
      const marcas = [...new Set(productos().map(p => p.marca).filter(Boolean))].sort();
      cntOp = cntOp || ("cnt-ini|" + Date.now());
      $("conteo").innerHTML = `<div class="card">
        <div class="nom">Empezar un conteo</div>
        <div class="err-s">Contá lo que está en <b>estanterías y pasillos</b>, también lo reservado que sigue sin etiqueta.
          <b>No cuentes ninguna caja con etiqueta de pedido</b>, esté facturada o no: el sistema suma solo las que todavía no descontó del stock (las ya facturadas y descontadas son del cliente aunque sigan en despacho). Tampoco lo que está «a revisar».
          Si un artículo está en varios lugares, sumalo con «Agregar de otro sector». Mientras contás un artículo, que nadie lo mueva: si entra o sale algo de él entre dos sectores, el sistema te pide recontar el total.</div>
        <label class="lbl" for="cntAlcance" style="margin-top:12px">¿Qué se cuenta?</label>
        <select id="cntAlcance" class="sel"><option value="con_stock">Los artículos con stock cargado</option><option value="todos">Todos los artículos de Queruclor</option>
          ${marcas.map(m => `<option value="marca:${esc(m)}">Solo la marca ${esc(m)}</option>`).join("")}</select>
        <button class="ok" id="cntEmpezar" style="margin-top:12px">Empezar el conteo</button></div>`;
      $("cntEmpezar").onclick = () => {
        const v = $("cntAlcance").value, alc = v.startsWith("marca:") ? { tipo: "marca", marca: v.slice(6) } : { tipo: v };
        let r; try { r = guardar(() => rpc("qr_conteo_iniciar", { p: { op: cntOp, alcance: alc, quien: E.quien() || "" } })); } catch (e) { return aviso("NO se empezó: sin conexión", "err"); }
        if (!r || !r.ok) return aviso((r && r.motivo) || "No se pudo empezar", "err");
        cntOp = null; cntVista = "pendientes"; pintarConteo();
      };
      return;
    }
    const pend = cnt.pendientes || [], lin = cnt.lineas || [];
    const difs = lin.filter(l => l.dif_cajas || l.dif_sueltas);
    const pct = cnt.total ? Math.round(cnt.contados / cnt.total * 100) : 0;
    const lista = cntVista === "pendientes" ? pend : cntVista === "difs" ? difs : lin;
    $("conteo").innerHTML = `
      <div class="cnt-prog">
        <div class="nom" style="margin:0">Conteo en curso</div>
        <div class="meta">Empezado ${new Date(cnt.creado).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })} por ${esc(cnt.creado_por || "—")} · alcance: ${esc(alcanceTxt(cnt.alcance))}</div>
        <div class="cnt-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
        <div class="cnt-kpi"><span><b>${cnt.contados}</b> de ${cnt.total} contados</span><span><b>${pend.length}</b> sin contar</span><span><b>${difs.length}</b> con diferencia</span></div>
      </div>
      <div class="cnt-tabs" role="tablist">
        <button type="button" data-v="pendientes" class="${cntVista === "pendientes" ? "on" : ""}">Sin contar (${pend.length})</button>
        <button type="button" data-v="contados" class="${cntVista === "contados" ? "on" : ""}">Contados (${lin.length})</button>
        <button type="button" data-v="difs" class="${cntVista === "difs" ? "on" : ""}">Diferencias (${difs.length})</button></div>
      <div id="cntLista">${lista.length ? lista.map(x => `<button type="button" class="cnt-i ${(x.dif_cajas || x.dif_sueltas) ? "dif" : ""}" data-ean="${esc(x.ean)}">
        <span class="n"><b>${esc(x.nombre)}</b><small>${cntVista === "pendientes" ? "sin contar · no es cero" : "contado por " + esc(x.quien || "—")}</small></span>
        <span class="q">${cntVista === "pendientes" ? "contar ›" : qtxt(x.cajas, x.sueltas, x.uc) + (cntVista === "difs" ? `<br><small>sistema ${qtxt(x.sistema_cajas, x.sistema_sueltas, x.uc)}</small>` : "")}</span></button>`).join("")
        : `<div class="vacio">${cntVista === "pendientes" ? "No queda nada sin contar." : "Nada todavía."}</div>`}</div>
      <button class="ok" id="cntFinalizar" style="margin-top:12px">Finalizar el conteo</button>`;
    $("conteo").querySelectorAll("[data-v]").forEach(b => { b.onclick = () => { cntVista = b.dataset.v; pintarConteo(); }; });
    $("conteo").querySelectorAll(".cnt-i").forEach(b => { b.onclick = () => abrirConteoArticulo(b.dataset.ean); });
    $("cntFinalizar").onclick = () => pintarRevisionFinal();
  }

  /* Una sola pantalla con todo lo que hace falta para decidir, en vez de
     un confirm() del navegador + una alerta aparte si falta algo. */
  function pintarRevisionFinal() {
    const pend = cnt.pendientes || [], lin = cnt.lineas || [];
    const difs = lin.filter(l => l.dif_cajas || l.dif_sueltas);
    $("conteo").innerHTML = `<div class="card">
        <div class="nom">Revisión antes de finalizar</div>
        <div class="cnt-kpi" style="margin:10px 0">
          <span><b>${lin.length}</b> contados</span><span><b>${difs.length}</b> con diferencia</span><span><b>${pend.length}</b> sin contar</span>
        </div>
        ${pend.length ? `<div class="aviso-lindo"><b>${pend.length} artículo${pend.length === 1 ? "" : "s"} sin contar</b> — si finalizás así, quedan <b>con el stock que ya tenían</b>: no se ponen en cero ni se tocan.
          <div class="hist" style="margin-top:6px">${pend.slice(0, 8).map(x => esc(x.nombre)).join("<br>")}${pend.length > 8 ? "<br>y " + (pend.length - 8) + " más" : ""}</div></div>`
        : `<div class="aviso-lindo" style="background:var(--vl);border-color:var(--v);color:var(--v)">No queda nada sin contar: se puede finalizar completo.</div>`}
        <div class="cnt-acc" style="margin-top:12px">
          <button class="ghost" id="rfVolver">Seguir contando</button>
          <button class="ok" id="rfFinalizar">${pend.length ? "Finalizar solo lo contado" : "Finalizar conteo"}</button>
        </div>
      </div>`;
    $("rfVolver").onclick = () => { cntVista = "pendientes"; pintarConteo(); };
    $("rfFinalizar").onclick = () => finalizarConteo(pend.length > 0);
  }
  const alcanceTxt = a => !a ? "" : a.tipo === "todos" ? "todos los artículos" : a.tipo === "marca" ? "marca " + a.marca : "artículos con stock cargado";

  function abrirConteoArticulo(ean, ficha, modoForzado) {
    if (!enBase()) return aviso("El conteo necesita el servidor compartido", "err");
    if (!cnt) { try { leerConteo(); } catch (e) {} }
    if (!cnt) { pintarConteo(); return aviso("Primero empezá un conteo", "err"); }
    const p = prodDe(ean) || {}; const uc = Number(p.uc) || (ficha && ficha.uc) || 1;
    const linea = (cnt.lineas || []).find(l => l.ean === ean);
    const pendiente = (cnt.pendientes || []).find(x => x.ean === ean);
    const enAlcance = linea || pendiente;
    /* Cajas con etiqueta de pedido que el sistema suma solo: el operario no las cuenta. */
    const desp = (pendiente && pendiente.en_despacho) || (linea && linea.en_despacho) || { cajas: 0, sueltas: 0 };
    const avisoDesp = desp.cajas || desp.sueltas
      ? `<div class="aviso-lindo"><b>${qtxt(desp.cajas, desp.sueltas, uc)} con etiqueta de pedido que el sistema suma</b> (preparadas, todavía no descontadas del stock). No cuentes ninguna caja etiquetada: si en despacho hay más etiquetadas de este artículo sin facturar, avisá antes de finalizar.</div>` : "";
    const op = "cnt|" + ean + "|" + Date.now();

    /* Sin conteo previo no hay nada para elegir entre sumar o corregir:
       se va directo al número. Con conteo previo, PRIMERO se elige el
       modo (dos acciones bien distintas) y RECIÉN AHÍ aparece el número,
       ya rotulado según lo elegido — así nunca se escribe un número sin
       saber todavía si va a sumarse o a reemplazar el total. */
    const modo = linea ? (modoForzado || null) : "fijar";

    if (linea && !modo) {
      $("conteo").innerHTML = `<div class="card es-caja">
          <div class="ficha"><img class="ficha-foto" src="${esc(fotoDe(p))}" alt="" onerror="this.style.visibility='hidden'">
            <div style="flex:1;min-width:0"><div class="tipo">CONTAR</div><div class="nom">${esc(p.nombreCompleto || ean)}</div>
            <div class="meta">${esc(p.marca || "")} · caja x ${uc}${uc === 1 ? " (la bolsa es la caja)" : ""}</div></div></div>
          <div class="cnt-hasta"><small>Contado hasta ahora</small><b>${qtxt(linea.cajas, linea.sueltas, uc)}</b><small>por ${esc(linea.quien || "—")}</small></div>
          <div class="cnt-modo">
            <button type="button" class="cnt-modo-b" id="irSumar"><em>➕</em><b>Agregar de otro sector</b><small>Encontraste más en otro lugar del depósito. Se SUMA a lo ya contado.</small></button>
            <button type="button" class="cnt-modo-b" id="irFijar"><em>✏️</em><b>Corregir el total contado</b><small>Ya revisaste todo y el número de arriba está mal. Se REEMPLAZA por el nuevo total.</small></button>
          </div>
          <button class="ghost" id="cntCero" style="width:100%">No hay ninguna: dejar en cero</button>
          <button class="ghost" id="cntVolver" style="width:100%;margin-top:8px">Volver</button>
          ${linea.historial && linea.historial.length ? `<div class="hist"><b>Historial</b><br>${linea.historial.map(h => esc(h.accion) + ": " + qtxt(h.cajas, h.sueltas, uc) +
            (h.antes ? " (antes " + qtxt(h.antes.cajas, h.antes.sueltas, uc) + ")" : "") + " · " + esc(h.quien || "—") + " · " + new Date(h.fecha).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })).join("<br>")}</div>` : ""}
        </div>`;
      $("irSumar").onclick = () => abrirConteoArticulo(ean, ficha, "sumar");
      $("irFijar").onclick = () => abrirConteoArticulo(ean, ficha, "fijar");
      $("cntCero").onclick = () => cntConfirmarCero(ean, ficha, uc);
      $("cntVolver").onclick = () => pintarConteo();
      return;
    }

    const titModo = modo === "sumar" ? "¿Cuánto encontraste en el OTRO sector?" : "¿Cuánto hay EN TOTAL, contando todo?";
    $("conteo").innerHTML = `<div class="card es-caja">
        <div class="ficha"><img class="ficha-foto" src="${esc(fotoDe(p))}" alt="" onerror="this.style.visibility='hidden'">
          <div style="flex:1;min-width:0"><div class="tipo">CONTAR${modo === "sumar" ? " · SUMAR OTRO SECTOR" : linea ? " · CORREGIR EL TOTAL" : ""}</div><div class="nom">${esc(p.nombreCompleto || ean)}</div>
          <div class="meta">${esc(p.marca || "")} · caja x ${uc}${uc === 1 ? " (la bolsa es la caja)" : ""}</div></div></div>
        ${linea ? `<div class="cnt-hasta chico"><small>Contado hasta ahora</small><b>${qtxt(linea.cajas, linea.sueltas, uc)}</b></div>` : ""}
        ${!enAlcance ? `<div class="aviso-lindo">Este artículo no estaba en lo elegido para este conteo. Al guardarlo, se agrega.</div>` : ""}
        ${avisoDesp}
        <label class="lbl" style="margin-top:4px">${esc(titModo)}</label>
        <div class="cnt-dos" ${uc === 1 ? 'style="grid-template-columns:1fr"' : ""}>
          <label>${uc === 1 ? "Unidades (bolsas)" : "Cajas cerradas"}<input id="cntC" type="number" inputmode="numeric" min="0" placeholder="—"></label>
          ${uc === 1 ? "" : `<label>Unidades sueltas<input id="cntS" type="number" inputmode="numeric" min="0" placeholder="—"></label>`}
        </div>
        <div class="err-s">Dejá vacío lo que no contaste${modo !== "sumar" ? ". Para decir que <b>no hay</b>, tocá «No hay: cero»." : "."}</div>
        <button class="ok" id="cntGuardar" style="margin-top:10px">${modo === "sumar" ? "Sumar al conteo" : linea ? "Corregir el conteo" : "Guardar el conteo"}</button>
        ${modo !== "sumar" ? `<div class="cnt-acc" style="margin-top:8px"><button class="ghost" id="cntCero">No hay: cero</button><button class="ghost" id="cntVolver">${linea ? "Volver a elegir" : "Volver"}</button></div>`
          : `<button class="ghost" id="cntVolver" style="width:100%;margin-top:8px">Volver a elegir</button>`}
      </div>`;
    const leerVal = id => { const v = ($(id) || {}).value; return v === "" || v == null ? null : Math.max(0, Math.floor(+v)); };
    const enviar = (cajas, sueltas, modoReal) => {
      if (ocupado) return;
      ocupado = true;
      let r;
      try { r = guardar(() => rpc("qr_conteo_registrar", { p: { sesion: cnt.id, op: op + "|" + modoReal, ean, cajas, sueltas, modo: modoReal, quien: E.quien() || "" } })); }
      catch (e) { ocupado = false; return aviso("NO se guardó: sin conexión. Tocá de nuevo cuando vuelva (no se duplica).", "err"); }
      ocupado = false;
      if (r && r.movido) {
        /* Hubo un movimiento de este artículo entre el primer sector y este:
           no se suma a ciegas. Se pide el total recontado, en la misma pantalla. */
        cnt = r.sesion || cnt;
        $("conteo").innerHTML = `<div class="card err">
            <div class="err-t">No se sumó: hubo un movimiento de este artículo</div>
            <div class="err-s">${esc(r.motivo)}</div>
            <div class="dupe-acc"><button class="ghost" id="movVolver">Volver</button><button class="ok" id="movFijar">Recontar y cargar el total</button></div></div>`;
        $("movVolver").onclick = () => pintarConteo();
        $("movFijar").onclick = () => abrirConteoArticulo(ean, ficha, "fijar");
        return;
      }
      if (!r || !r.ok) return aviso((r && r.motivo) || "No se pudo guardar", "err");
      aviso(r.repetida ? "Ya estaba guardado" : "Conteo guardado · pendiente de finalizar", "ok");
      cnt = r.sesion; pintarConteo();
    };
    $("cntGuardar").onclick = () => {
      const c = leerVal("cntC"), s = uc === 1 ? 0 : leerVal("cntS");
      if (c == null && (s == null || uc === 1)) return aviso("Poné lo que contaste, o tocá «No hay: cero»", "err");
      enviar(c || 0, s || 0, modo === "sumar" ? "sumar" : "fijar");
    };
    if ($("cntCero")) $("cntCero").onclick = () => cntConfirmarCero(ean, ficha, uc);
    $("cntVolver").onclick = () => linea ? abrirConteoArticulo(ean, ficha) : pintarConteo();
    $("cntC").focus();
  }

  /* «No hay» es una afirmación fuerte (deja el número en cero): se
     confirma en la misma pantalla, sin el diálogo nativo del navegador,
     diciendo exactamente qué queda en cero. */
  function cntConfirmarCero(ean, ficha, uc) {
    const p = prodDe(ean) || {};
    $("conteo").innerHTML = `<div class="card err">
        <div class="err-t">¿Confirmás que no hay ninguna unidad?</div>
        <div class="err-s"><b>${esc(p.nombreCompleto || ean)}</b> queda contado en <b>0 ${uc === 1 ? "unidades" : "cajas"}${uc === 1 ? "" : " y 0 sueltas"}</b>.</div>
        <div class="dupe-acc"><button class="ghost" id="ceroNo">No, volver</button><button class="ok" id="ceroSi">Sí, confirmar cero</button></div>
      </div>`;
    $("ceroNo").onclick = () => abrirConteoArticulo(ean, ficha);
    $("ceroSi").onclick = () => {
      if (ocupado) return;
      ocupado = true;
      const op = "cnt|" + ean + "|" + Date.now() + "|cero";
      let r;
      try { r = guardar(() => rpc("qr_conteo_registrar", { p: { sesion: cnt.id, op, ean, cajas: 0, sueltas: 0, modo: "fijar", quien: E.quien() || "" } })); }
      catch (e) { ocupado = false; return aviso("NO se guardó: sin conexión. Tocá de nuevo cuando vuelva (no se duplica).", "err"); }
      ocupado = false;
      if (!r || !r.ok) return aviso((r && r.motivo) || "No se pudo guardar", "err");
      aviso("Queda en cero · pendiente de finalizar", "ok");
      cnt = r.sesion; pintarConteo();
    };
  }

  function finalizarConteo(dejarFuera) {
    if (ocupado || !cnt) return;
    cntFin = cntFin || ("cnt-fin|" + cnt.id + "|" + Date.now());
    ocupado = true;
    let r;
    try { r = guardar(() => rpc("qr_conteo_finalizar", { p: { sesion: cnt.id, op: cntFin, quien: E.quien() || "", dejar_fuera: !!dejarFuera } })); }
    catch (e) { ocupado = false; return aviso("NO se finalizó: sin conexión. El conteo sigue guardado.", "err"); }
    ocupado = false;
    if (r && !r.ok && r.faltan) {
      /* Puede pasar si algo se contó justo entre la revisión y el toque
         de «Finalizar»: se vuelve a la revisión con el número al día. */
      cnt.pendientes = r.faltan; return pintarRevisionFinal();
    }
    if (!r || !r.ok) return aviso((r && r.motivo) || "No se pudo finalizar", "err");
    const res = (r.sesion && r.sesion.resultado) || {};
    cntFin = null; cnt = null;
    cntCierre = res;
    pintarCierreConteo();
  }

  /* Cartel de cierre, prominente y propio: NO se tapa con el formulario
     de un conteo nuevo hasta que la persona toca «Empezar otro conteo». */
  function pintarCierreConteo(detalle) {
    const res = cntCierre; if (!res) return pintarConteo();
    const lineas = res.lineas || [];
    const conDif = lineas.filter(x => x.diferencia.cajas || x.diferencia.sueltas);
    const sinCambios = lineas.length - conDif.length;
    const conMov = lineas.filter(x => x.movido_despues && (x.movido_despues.cajas || x.movido_despues.sueltas));
    const conDesp = lineas.filter(x => x.en_despacho && (x.en_despacho.cajas || x.en_despacho.sueltas));
    const fuera = res.fuera || [];
    $("conteo").innerHTML = `<div class="card cierre-cnt">
        <div class="cierre-ok">✅ Conteo finalizado</div>
        <div class="cierre-cifra"><b>${lineas.length}</b> actualizado${lineas.length === 1 ? "" : "s"} · <b>${sinCambios}</b> sin cambios</div>
        ${fuera.length ? `<div class="aviso-lindo">${fuera.length} quedaron fuera (sin contar): siguen con el stock que ya tenían, no se tocaron.</div>` : ""}
        <button class="ghost" id="verResultado" style="width:100%;margin-top:8px">${detalle ? "Ocultar el detalle" : "Ver resultado"}</button>
        ${detalle ? `<div class="hist" style="margin-top:10px">
            ${conDif.length ? `<b>Con diferencia (${conDif.length})</b><br>${conDif.slice(0, 20).map(x => esc(x.ean) + ": quedó " + qtxt(x.queda.cajas, x.queda.sueltas, 1) + " (diferencia " + (x.diferencia.cajas >= 0 ? "+" : "") + x.diferencia.cajas + " cajas / " + (x.diferencia.sueltas >= 0 ? "+" : "") + x.diferencia.sueltas + " un.)").join("<br>")}<br><br>` : ""}
            ${conDesp.length ? `<b>Con cajas etiquetadas en despacho (${conDesp.length})</b><br>${conDesp.map(x => esc(x.ean) + ": " + x.en_despacho.cajas + " cajas / " + x.en_despacho.sueltas + " un. con etiqueta, todavía no descontadas: sumadas por el sistema").join("<br>")}<br><br>` : ""}
            ${conMov.length ? `<b>Con movimientos mientras se contaba (${conMov.length})</b><br>${conMov.map(x => esc(x.ean) + ": se movieron " + x.movido_despues.cajas + " cajas / " + x.movido_despues.sueltas + " un. en el sistema — ya están sumados, no se pisaron").join("<br>")}<br><br>` : ""}
            ${fuera.length ? `<b>Dejados fuera (${fuera.length})</b><br>${fuera.slice(0, 20).map(x => esc(x.nombre)).join("<br>")}` : ""}
          </div>` : ""}
        <button class="ok" id="cierreNuevo" style="width:100%;margin-top:12px">Empezar otro conteo</button>
      </div>`;
    $("verResultado").onclick = () => pintarCierreConteo(!detalle);
    $("cierreNuevo").onclick = () => { cntCierre = null; pintarConteo(); };
  }

  /* ── Consultas ────────────────────────────────────────────────── */
  function pintarStock() {
    const filas = Stock.todos();
    if (!filas.length) { $("listaStock").innerHTML = `<div class="vacio">Todavía no hay stock cargado.<br>Usá <b>Recibir del proveedor</b>.</div>`; return; }
    const idx = E.indice();
    const nombre = ean => { const f = idx.get(String(ean)); return f ? f.nombre : ean; };
    $("listaStock").innerHTML = filas.sort((a, b) => nombre(a.ean).localeCompare(nombre(b.ean))).map(s => {
      const f = Stock.fisico(s.ean), r = Stock.reservado(s.ean);
      const hayRes = r.cajas > 0 || r.unidades > 0;
      return `<div class="st-i ${s.cajas === 0 ? "sin" : ""}"><div class="st-n">${esc(nombre(s.ean))}</div>
        <div class="st-c"><b>${s.cajas}</b> cajas · <b>${s.unidades}</b> un. disponibles
          ${hayRes ? `<span class="st-r">reservadas: ${r.cajas} cajas · ${r.unidades} un. (siguen en el depósito)</span>` : ""}
          <span class="st-f">físico: ${f.cajas} cajas + ${f.sueltas} sueltas</span></div></div>`;
    }).join("");
  }
  const ICONO = { ingreso: "📥", conteo: "🔢", venta: "🛒", devolucion: "↩️", ajuste: "⚖️", apertura: "✂️" };
  function pintarMovs() {
    const m = Stock.movimientos().slice().reverse();
    if (!m.length) { $("listaMovs").innerHTML = `<div class="vacio">Sin movimientos todavía.</div>`; return; }
    const idx = E.indice();
    $("listaMovs").innerHTML = m.slice(0, 120).map(x => {
      const f = idx.get(String(x.ean));
      const cant = [x.cajas ? (x.cajas > 0 ? "+" : "") + x.cajas + " cajas" : "", x.sueltas ? (x.sueltas > 0 ? "+" : "") + x.sueltas + " un." : ""].filter(Boolean).join(" · ");
      return `<div class="mv-i ${x.aplicado === false ? "no-ap" : ""}"><span class="mv-ic">${ICONO[x.tipo] || "•"}</span>
        <div class="mv-b"><div class="mv-n">${esc(f ? f.nombre : x.ean)}</div>
          <div class="mv-m">${esc(x.tipo)}${x.motivo ? " · " + esc(x.motivo) : ""}${x.ref ? " · " + esc(x.ref) : ""}${x.quien ? " · " + esc(x.quien) : ""}</div>
          ${x.aplicado === false ? `<div class="mv-no">no se aplicó: ${esc(x.motivo_no_aplicado || "")}</div>` : ""}</div>
        <span class="mv-c">${esc(cant || "—")}</span></div>`;
    }).join("");
  }

  /* ── Arranque ─────────────────────────────────────────────────── */
  function iniciar() {
    if ($("hdLogo")) $("hdLogo").innerHTML = window.LogoSVG ? LogoSVG.lockupHD("22px") : "📦";
    pintarQuien();
    $("quienActual").onclick = pedirQuien;
    TAREAS.forEach(t => { $("t-" + t).onclick = () => setTarea(t); });
    $("t-stock").onclick = () => setTarea("stock");
    $("t-movs").onclick = () => setTarea("movs");
    $("manual").onkeydown = e => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const v = $("manual").value.trim();
      if (v) { $("manual").value = ""; procesarEntrada(v, "enter"); }
    };
    $("manual").oninput = () => {
      const v = $("manual").value.trim();
      if (v.length >= 3 && /[a-zA-ZáéíóúñÁÉÍÓÚÑ]/.test(v)) pintarSugerencias(buscarNombre(v)); else $("sugerencias").innerHTML = "";
    };
    $("manualBtn").onclick = () => { const v = $("manual").value.trim(); if (v) { $("manual").value = ""; procesarEntrada(v, "enter"); } };
    prepararCamara();
    const rotos = E.sinCodigo();
    if (rotos.length) {
      $("avisoRotos").style.display = "";
      $("avisoRotos").innerHTML = `⚠️ <b>${rotos.length} artículos sin código de caja usable</b> — el escáner no los reconoce por caja: buscalos por nombre o leé el código de la unidad. ${rotos.map(r => esc(r.nombre.split(" ").slice(0, 4).join(" "))).join(" · ")}`;
    }
    estado("", navigator.onLine ? "Conectado" : "Sin conexión");
    setTarea(tarea);
  }

  window.StockUI = { setTarea, procesarEntrada, estado: () => ({ tarea, vista, conteo: cnt }) };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
  else iniciar();

})();

</script>
</body>
</html>
