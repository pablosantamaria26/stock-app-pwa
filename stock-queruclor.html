   ═══════════════════════════════════════════════════════════════════ */

<script>
/* ═══════════════════════════════════════════════════════════════════
   CATÁLOGO COMPARTIDO — una sola fuente de verdad, indexada por EAN

   Lo escribe el admin cuando se sube la lista del proveedor.
   Lo leen la app del vendedor (precios) y facturación (para armar la
   factura a partir del código de barras que llega en el pedido).

   En el prototipo vive en localStorage. En producción es la tabla
   `catalogo_queruclor` de Supabase: la forma de los registros es la
   misma, así que migrar es cambiar el guardar/leer, no el resto.
   ═══════════════════════════════════════════════════════════════════ */
(function (global) {

  const KEY = "qr_catalogo_v1";
  const KEY_META = "qr_catalogo_meta_v1";

  /* ── Columnas de la lista del proveedor (índice 0 = col A) ──────
     A Articulos · B EAN13 · C DUN14 · D Marca · E U/C · L ImagenUrl
     M Costo Unidad · P Costo Unidad Neto (SIN IVA, el header engaña)  */
  const COL = { nombre: 0, ean: 1, dun: 2, marca: 3, uc: 4, imagen: 11, costoBruto: 12, costoNeto: 15 };

  const leer = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const guardar = c => localStorage.setItem(KEY, JSON.stringify(c));
  /* Para consultar (buscar/todos/cuantos): memoria por contenido, igual que
     el stock. Se devuelven copias, así nadie puede ensuciar la memoria. */
  let memoCat = { raw: null, obj: {} };
  const leerRO = () => {
    const raw = localStorage.getItem(KEY);
    if (raw !== memoCat.raw) { let o; try { o = JSON.parse(raw) || {}; } catch (e) { o = {}; } memoCat = { raw, obj: o }; }
    return memoCat.obj;
  };
  const meta = () => { try { return JSON.parse(localStorage.getItem(KEY_META)) || {}; } catch (e) { return {}; } };

  /* ── Precio de venta ──────────────────────────────────────────────
     Delega en `precio.js`, que es el único lugar donde vive la fórmula.

     Devuelve el precio FINAL, con IVA incluido. Es lo que ve el
     vendedor, lo que dice el remito que viaja con el pedido y lo que se
     cobra. La factura de Laura lo desarma abajo del total.

     CUIDADO CON LO QUE SIGNIFICA `margen` ACÁ. Ahora es el margen
     OBJETIVO —lo que se quiere ganar limpio— y no el margen de lista.
     Los impuestos que se llevan un porcentaje de la venta (IIBB,
     impuesto al cheque) los agrega `precio.js` encima.

     Antes esta función hacía `costoNeto × 1,21 ÷ (1 − margen)`: metía el
     IVA de compra como si fuera costo, cuando en realidad se recupera
     como crédito fiscal, y encima facturación volvía a sumar 21% al
     final. El 21% aparecía dos veces y el precio salía un 21% arriba
     de lo que se creía estar cobrando. */
  function precioVenta(costoNeto, margen) {
    if (global.Precio) return Precio.final(costoNeto, margen);
    /* Respaldo por si el módulo no cargó: la misma cuenta sin
       impuestos, para no dejar el catálogo en cero. */
    const m = Number(margen);
    if (!(m >= 0 && m < 1)) return 0;
    return (Number(costoNeto) || 0) / (1 - m) * 1.21;
  }

  /* ── Lee las filas crudas del Excel y arma los registros ────────
     `filas` es el array de arrays de SheetJS (header:1).            */
  /* Los códigos son TEXTO. Si Excel guardó la celda como número, se perdió
     el cero inicial (un EAN13 «0779…» llega como 779…, 12 dígitos): se
     repone solo ese cero, solo en ese caso. Nada se calcula ni se inventa. */
  function codigoTexto(v, largo) {
    if (v == null) return "";
    if (typeof v === "number") {
      const s = String(Math.round(v));
      return s.length === largo - 1 ? "0" + s : s;
    }
    return String(v).trim();
  }

  function desdeLista(filas, margen) {
    const out = [];
    for (let i = 2; i < filas.length; i++) {          // 0 y 1 son encabezados
      const r = filas[i];
      if (!r || !r[COL.nombre]) continue;

      /* El EAN sale de la columna B, no del URL de la imagen: la columna
         lo tiene siempre y el URL puede faltar. */
      const ean = codigoTexto(r[COL.ean], 13);
      if (!/^\d{8,14}$/.test(ean)) continue;
      /* DUN14: solo si es un código. La lista de junio trae «26» en los
         polvos CAJA X 1: queda vacío y se guarda lo que vino, sin inventar. */
      const dunCrudo = codigoTexto(r[COL.dun], 14);
      const dunOk = /^\d{12,14}$/.test(dunCrudo);

      const costoNeto = parseFloat(r[COL.costoNeto]);
      if (!(costoNeto > 0)) continue;

      const uc = parseInt(r[COL.uc], 10) || 1;
      const precioUnit = Math.round(precioVenta(costoNeto, margen) * 100) / 100;

      out.push({
        ean,
        dun: dunOk ? dunCrudo : "",
        ...(dunCrudo && !dunOk ? { dunLista: dunCrudo } : {}),
        nombreCompleto: String(r[COL.nombre]).trim(),
        marca: String(r[COL.marca] == null ? "" : r[COL.marca]).trim(),
        uc,
        costoNeto: Math.round(costoNeto * 100) / 100,
        precioUnit,
        precioBulto: Math.round(precioUnit * uc * 100) / 100,
        imagen: String(r[COL.imagen] == null ? "" : r[COL.imagen]).trim(),
        activo: true,
      });
    }
    return out;
  }

  /* ── Compara la lista nueva contra lo guardado ─────────────────
     Devuelve qué cambia sin tocar nada: el admin lo muestra y recién
     al confirmar se escribe.                                        */
  function comparar(nuevos) {
    const actual = leer();
    const altas = [], cambios = [], iguales = [];
    for (const p of nuevos) {
      const viejo = actual[p.ean];
      if (!viejo) { altas.push(p); continue; }
      if (Math.abs((viejo.costoNeto || 0) - p.costoNeto) < 0.005 && viejo.uc === p.uc) {
        iguales.push(p); continue;
      }
      cambios.push(Object.assign({}, p, {
        costoAnterior: viejo.costoNeto,
        pct: viejo.costoNeto ? ((p.costoNeto - viejo.costoNeto) / viejo.costoNeto) * 100 : 0,
        ucAnterior: viejo.uc,
      }));
    }
    const enLista = new Set(nuevos.map(p => p.ean));
    const ausentes = Object.values(actual).filter(p => p.activo !== false && !enLista.has(p.ean));
    return { altas, cambios, iguales, ausentes };
  }

  /* ── Aplica la lista: alta de nuevos + actualización de existentes ── */
  function aplicar(nuevos, opts) {
    opts = opts || {};
    const cat = leer();
    const hist = historial();
    const ahora = new Date().toISOString();

    for (const p of nuevos) {
      const viejo = cat[p.ean];
      if (viejo && Math.abs((viejo.costoNeto || 0) - p.costoNeto) > 0.005) {
        hist.push({
          ean: p.ean, nombre: p.nombreCompleto,
          costoAnterior: viejo.costoNeto, costoNuevo: p.costoNeto,
          pct: viejo.costoNeto ? ((p.costoNeto - viejo.costoNeto) / viejo.costoNeto) * 100 : 0,
          fecha: ahora, origen: opts.archivo || "lista",
        });
      }
      /* Se conserva lo que el admin haya ajustado a mano y la lista no trae. */
      cat[p.ean] = Object.assign({}, viejo || {}, p, {
        actualizado: ahora,
        margenOverride: viejo ? viejo.margenOverride : undefined,
      });
      /* El precio que trae la lista se calculó con el margen GENERAL. Un
         artículo con margen propio (o de su sección) tiene que salir con
         el suyo, si no la lista nueva le pisa el precio sin avisar. */
      const general = typeof opts.margen === "number" ? opts.margen
        : (global.Precio ? Precio.config().margenObjetivo : undefined);
      if (typeof general === "number" && cat[p.ean].costoNeto > 0) {
        const nuevo = cat[p.ean];
        nuevo.precioUnit = Math.round(precioVenta(nuevo.costoNeto, margenDe(nuevo, general)) * 100) / 100;
        nuevo.precioBulto = Math.round(nuevo.precioUnit * (nuevo.uc || 1) * 100) / 100;
      }
    }

    /* Los que ya no vienen en la lista se desactivan, no se borran:
       un pedido viejo tiene que poder seguir consultando su precio. */
    if (opts.desactivarAusentes) {
      const enLista = new Set(nuevos.map(p => p.ean));
      for (const ean of Object.keys(cat)) {
        if (!enLista.has(ean)) { cat[ean].activo = false; cat[ean].bajaEn = ahora; }
      }
    }

    guardar(cat);
    localStorage.setItem("qr_historial_precios_v1", JSON.stringify(hist));
    localStorage.setItem(KEY_META, JSON.stringify({
      archivo: opts.archivo || "", fecha: ahora,
      margen: opts.margen, total: Object.keys(cat).length,
    }));
    return { total: Object.keys(cat).length };
  }

  function historial() {
    try { return JSON.parse(localStorage.getItem("qr_historial_precios_v1")) || []; } catch (e) { return []; }
  }

  /* ── Consulta: es lo que usa facturación con el EAN del pedido ── */
  function buscar(ean) { const f = leerRO()[String(ean).trim()]; return f ? Object.assign({}, f) : null; }
  function todos() { return Object.values(leerRO()).map(f => Object.assign({}, f)); }
  function cuantos() { return Object.keys(leerRO()).length; }

  /* ── Siembra automática desde la lista embebida ────────────────
     localStorage es POR ORIGEN: lo que se sube en el admin abierto con
     localhost no existe para una página abierta con file://. Sin esta
     siembra, facturación se queda sin precios y no puede armar nada.
     Corre sola al cargar el store; el admin la pisa al subir una lista. */
  function sembrar(margen) {
    const base = global.CATALOGO_BASE;
    if (!base || !base.productos) return 0;
    if (cuantos() > 0) return 0;                 // ya hay catálogo: no se toca

    const m = typeof margen === "number" ? margen : 0.235;
    const cat = {};
    for (const p of base.productos) {
      const precioUnit = Math.round(precioVenta(p.costoNeto, m) * 100) / 100;
      cat[p.ean] = Object.assign({}, p, {
        precioUnit,
        precioBulto: Math.round(precioUnit * p.uc * 100) / 100,
        activo: true,
        origen: "lista-embebida",
      });
    }
    guardar(cat);
    localStorage.setItem(KEY_META, JSON.stringify({
      archivo: base.archivo, fecha: base.generado, margen: m,
      total: Object.keys(cat).length, sembrado: true,
    }));
    return Object.keys(cat).length;
  }

  /* ── Márgenes por rubro ───────────────────────────────────────────
     No todo el catálogo tiene que ganar lo mismo. La lavandina es lo
     más barato y lo que más rota: es con lo que se entra al cliente, y
     ahí el margen tiene que ser fino. Un insecticida se vende de a
     poco, se elige por marca y aguanta más.

     Un margen único para los 58 artículos obliga a elegir entre perder
     competitividad en lo que más se vende o regalar plata en lo que
     rota poco.

     ── QUIÉN GANA ───────────────────────────────────────────────
     De lo más específico a lo más general:

       1. margenOverride  → este artículo puntual, decidido a mano
       2. margen del rubro → toda la sección
       3. margen general   → el resto

     Ese orden importa: si el rubro pisara al artículo, cada vez que se
     toca una sección se perderían los precios que alguien ajustó uno
     por uno, y nadie se daría cuenta hasta que un cliente reclame. */
  const K_RUBROS = "qr_margen_rubros_v1";

  function margenesRubro() {
    try { return JSON.parse(localStorage.getItem(K_RUBROS)) || {}; }
    catch (e) { return {}; }
  }

  function setMargenRubro(rubro, margen) {
    const m = margenesRubro();
    const r = String(rubro || "").toUpperCase();
    /* null o vacío borra el override y el rubro vuelve al general. */
    if (margen == null || margen === "") delete m[r];
    else m[r] = Number(margen);
    localStorage.setItem(K_RUBROS, JSON.stringify(m));
    return m;
  }

  /* ── A qué rubro pertenece un artículo ────────────────────────────
     La lista del proveedor NO trae la categoría: los 202 artículos
     vienen con `nombreCompleto` y nada más. Quien la deduce del nombre
     es `Compras.categoria()`, que ya está hecha y probada.

     Se usa esa y no un campo `cat` propio, porque tener dos
     clasificadores distintos garantiza que algún día no coincidan: el
     margen diría LAVANDINAS y el motor de compras LIMPIADORES para el
     mismo producto. Uno solo, o ninguno. */
  function rubroDe(p) {
    if (!p) return "";
    if (p.cat) return String(p.cat).toUpperCase();
    if (global.Compras && Compras.categoria) {
      try { return Compras.categoria(p); } catch (e) {}
    }
    return "";
  }

  /* El margen que le toca a un artículo, con la precedencia de arriba. */
  function margenDe(p, general) {
    if (p && typeof p.margenOverride === "number") return p.margenOverride;
    const porRubro = margenesRubro();
    const r = rubroDe(p);
    if (typeof porRubro[r] === "number") return porRubro[r];
    return general;
  }

  /* Vuelve a calcular los precios de venta con otro margen, sin perder
     los costos ni lo que haya cargado el admin. */
  function recalcularMargen(margen) {
    const cat = leer();
    for (const ean of Object.keys(cat)) {
      const p = cat[ean];
      p.precioUnit = Math.round(precioVenta(p.costoNeto, margenDe(p, margen)) * 100) / 100;
      p.precioBulto = Math.round(p.precioUnit * (p.uc || 1) * 100) / 100;
    }
    guardar(cat);
    return Object.keys(cat).length;
  }

  /* Los rubros que existen de verdad en el catálogo, con cuántos
     artículos tiene cada uno y qué margen les está rigiendo. Se lee del
     catálogo y no de una lista escrita a mano: si mañana entra un rubro
     nuevo, aparece solo. */
  function rubros() {
    const cat = leer();
    const general = (meta() || {}).margen;
    const porRubro = margenesRubro();
    const out = new Map();
    for (const ean of Object.keys(cat)) {
      const p = cat[ean];
      const r = rubroDe(p) || "SIN RUBRO";
      const e = out.get(r) || { rubro: r, articulos: 0, costo: 0, venta: 0 };
      e.articulos++;
      e.costo += (p.costoNeto || 0) * (p.uc || 1);
      e.venta += (p.precioBulto || 0);
      out.set(r, e);
    }
    return [...out.values()].map(e => Object.assign(e, {
      margen: typeof porRubro[e.rubro] === "number" ? porRubro[e.rubro] : general,
      propio: typeof porRubro[e.rubro] === "number",
    })).sort((a, b) => b.articulos - a.articulos);
  }

  /* ── Publicar y traer del servidor ────────────────────────────────
     El admin PUBLICA el catálogo; las demás apps lo TRAEN al abrir. Es
     el mismo circuito que va a tener producción con el Worker y Supabase:
     una sola subida de lista y todas las apps quedan al día, sin generar
     ni recompilar nada. Si el servidor no está (por ejemplo con file://),
     se sigue con lo que haya en localStorage o con la lista embebida. */
  /* QR_API_BASE: la copia de PRUEBA (GitHub Pages) apunta a un servidor
     aparte; en el sistema normal queda vacío y se usa /api del mismo lugar. */
  const API = ((typeof window !== "undefined" && window.QR_API_BASE) || "") + "/api/catalogo";

  async function publicar() {
    const cat = leer(), m = meta();
    const cuerpo = {
      publicado: new Date().toISOString(),
      archivo: m.archivo || "", margen: m.margen,
      productos: cat,
    };
    /* El catálogo fija lo que paga cada cliente: el servidor exige el token
       de Administración de esta PC (02/11/2026, cierre). Catalogo.publicar()
       solo se llama desde pantallas de Admin — nunca desde Vendedor/Depósito. */
    const token = (typeof window !== "undefined" && window.AdminToken) ? AdminToken.obtener() : null;
    const r = await fetch(API, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, token ? { "X-Admin-Token": token } : {}),
      body: JSON.stringify(cuerpo),
    });
    if (window.AdminToken) AdminToken.siRechazo(r.status);
    if (r.status === 403) throw new Error("Falta o es incorrecto el token de Administración de esta PC (volvé a intentar: se pide de nuevo).");
    if (!r.ok) throw new Error("el servidor rechazó la publicación (" + r.status + ")");

    /* Queda anotado en el meta: si no, el admin no puede distinguir
       "cargado acá" de "ya lo tiene todo el sistema". */
    const resp = await r.json().catch(() => ({}));
    if (resp && resp.publicado) cuerpo.publicado = resp.publicado;
    localStorage.setItem(KEY_META, JSON.stringify(
      Object.assign({}, m, { publicado: cuerpo.publicado, origen: "publicado" })));
    return resp;
  }

  /* Trae el catálogo publicado si es MÁS NUEVO que el local. Nunca pisa
     algo más reciente: si el admin acaba de subir una lista en este
     equipo, no se la lleva por delante una publicación vieja. */

  /* «¿Hay algo nuevo?» antes de bajar todo: /api/version es un JSON de
     ~150 bytes con la fecha de cada colección. Así las apps pueden mirar
     seguido sin gastar el cupo del plan gratuito bajando la lista entera
     cada vez. Un servidor sin /api/version (el local) da 404 y se sigue
     con la descarga completa, como siempre. */
  async function sinCambios(col, local) {
    const base = (typeof window !== "undefined" && window.QR_API_BASE) || "";
    if (!local) return false;   // sin base: el mismo servidor (el de prueba ya tiene /api/version)
    try {
      const r = await fetch(base + "/api/version", { cache: "no-store" });
      if (!r.ok) return false;
      const v = await r.json();
      return !!(v && v[col]) && v[col] <= local;
    } catch (e) { return false; }
  }

  async function traer() {
    if (await sinCambios("catalogo", meta().publicado)) return { estado: "al-dia", total: cuantos() };
    let r;
    try { r = await fetch(API, { cache: "no-store" }); }
    catch (e) { return { estado: "sin-servidor" }; }
    if (!r.ok) return { estado: "sin-publicar" };

    const datos = await r.json();
    if (!datos || !datos.productos) return { estado: "sin-publicar" };

    const local = meta();
    const fechaLocal = local.publicado || local.fecha || "";
    if (fechaLocal && datos.publicado && datos.publicado <= fechaLocal) {
      return { estado: "al-dia", total: cuantos() };
    }

    guardar(datos.productos);
    localStorage.setItem(KEY_META, JSON.stringify({
      archivo: datos.archivo || "", fecha: (datos.publicado || "").slice(0, 10),
      publicado: datos.publicado, margen: datos.margen,
      total: Object.keys(datos.productos).length, origen: "servidor",
    }));
    return { estado: "actualizado", total: Object.keys(datos.productos).length };
  }

  /* Habilitar / deshabilitar para los vendedores. Queda en la ficha y viaja
     con la publicación; una lista nueva NO lo pisa (aplicar conserva lo
     que la lista no trae). Ver catalogo-vendedor.js. */
  function setVendible(eans, valor) {
    const cat = leer();
    let n = 0;
    for (const e of [].concat(eans)) {
      const f = cat[String(e)];
      if (!f) continue;
      f.vendible = !!valor; f.vendibleEn = new Date().toISOString(); n++;
    }
    if (n) guardar(cat);
    return n;
  }

  global.Catalogo = {
    setVendible,
    COL, precioVenta, desdeLista, comparar, aplicar,
    buscar, todos, cuantos, historial, meta, sembrar, recalcularMargen,
    margenesRubro, setMargenRubro, margenDe, rubroDe, rubros,
    publicar, traer, API,
    _leer: leer, _guardar: guardar,
  };

  /* Arranque: primero la semilla embebida (para no quedar nunca en cero),
     después se intenta traer lo publicado, que es la fuente de verdad. */
  try {
    const n = sembrar();
    if (n) console.log("%c[catálogo] semilla embebida: " + n + " productos",
      "color:#0e6b3e;font-weight:700");
  } catch (e) { console.warn("[catálogo] no se pudo sembrar:", e); }

  global.catalogoListo = traer().then(r => {
    const msg = {
      actualizado: "[catálogo] actualizado desde el servidor: " + r.total + " productos",
      "al-dia": "[catálogo] al día con el servidor",
      "sin-publicar": "[catálogo] el servidor no tiene lista publicada — se usa la embebida",
      "sin-servidor": "[catálogo] sin servidor — se usa lo local (¿abriste con file://?)",
    }[r.estado];
    console.log("%c" + msg, "color:#0e6b3e;font-weight:700");
    if (global.onCatalogoListo) try { global.onCatalogoListo(r); } catch (e) {}
    return r;
  }).catch(e => { console.warn("[catálogo] error al traer:", e); return { estado: "error" }; });
  if (typeof module !== "undefined" && module.exports) module.exports = global.Catalogo;

})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   FORMATOS DE VENTA — cómo se puede comprar cada artículo

   Casi todo Queruclor se vende SOLO por caja cerrada: la lavandina no se
   vende por botella. Pero hay excepciones, y son cosas distintas que
   conviene no mezclar:

   · SUELTO   → el artículo se puede comprar de a unidades, sin llevar la
                caja entera. Son los insecticidas y repelentes: un kiosco
                lleva 3 repelentes, no una caja de 12.

   · SURTIDA  → la familia se puede armar como una caja MIXTA, juntando
                unidades de variedades distintas adentro de una sola caja
                (siempre en múltiplos de la caja: 12 gatillos, 24 doy packs).
                Hoy: limpiador antigrasa + limpiavidrios, en gatillo y en
                doy pack. Se mezclan solo entre sí y del mismo formato.

   · SOLO_CAJA → familias con varios aromas que NO admiten surtida: se
                elige cuántas cajas cerradas de cada aroma, y nada más.
                Son los limpiapisos (decisión comercial: caja cerrada, no
                se venden sueltos ni mezclados).

   Por qué importa que esto esté acá y no adivinado: el escáner del
   depósito preguntaba «¿cuántas UNIDADES entraron?» al leer el código de
   una botella de lavandina, y la lavandina no tiene unidades sueltas.
   Todo lo que no esté en estas listas se maneja solo por caja.

   Esto va a terminar siendo una columna del catálogo que se edita desde
   el admin. Por ahora vive acá, que es un lugar visible y fácil de tocar.
   ═══════════════════════════════════════════════════════════════════ */
(function (global) {

  /* Se venden por unidad además de por caja (EAN13 del envase) */
  const SUELTO = [
    "7791905002413",  // Cebo Mata Cucaracha x8            · caja x 24
    "7791905002338",  // Espiral Mata Mosquitos Perfumados · caja x 48
    "7791905002383",  // Espiral Mata Mosquitos x12        · caja x 48
    "7791905002390",  // Insecticida Mata Cucarachas 380ml · caja x 12
    "7791905023265",  // Insecticida Mata Cucarachas Ultra · caja x 12
    "7791905002376",  // Insecticida Moscas/Mosquitos 370  · caja x 12
    "7791905023258",  // Insecticida Moscas/Mosq. Ultra    · caja x 12
    "7791905023784",  // Repelente Mosquitos 143ml         · caja x 12
    "7791905024897",  // Repelente Mosquitos 165ml         · caja x 12
    "7791905002345",  // Tableta Mata Mosquitos x12        · caja x 20
    "7791905002352",  // Tableta Mata Mosquitos x24        · caja x 20
    "7791905004424",  // Talco Pédico 100g                 · caja x 12
    "7791905004431",  // Talco Pédico 200g                 · caja x 12
  ];

  /* Familias que se pueden armar como caja surtida (mezcla de variedades).
     Van con las variantes escritas al lado a propósito: este módulo lo
     carga la pantalla de stock, donde el CATALOGO curado del vendedor no
     existe. Si dependiera de él, el escáner no reconocería las variantes
     como artículos con unidades sueltas. */
  const SURTIDA = {
    "limpiador-gatillo-odex-500": [
      "7791905004394",  // Limpia Antigrasa Gatillo 500ml · caja x 12
      "7791905004370",  // Limpia Vidrios Gatillo 500ml   · caja x 12
    ],
    "limpiador-pack-odex-450": [
      "7791905004387",  // Limpia Antigrasa Doy Pack 450ml · caja x 24
      "7791905004363",  // Limpia Vidrios Doy Pack 450ml   · caja x 24
    ],
  };

  /* Familias con aromas que se venden SOLO por caja cerrada (sin surtida). */
  const SOLO_CAJA = [
    "limpiapisos-odex-900",
    "limpiapisos-odex-1800",
    "limpiapisos-odex-4l",
  ];

  const setSuelto = new Set(SUELTO);
  const setSoloCaja = new Set(SOLO_CAJA);
  const setSurtida = new Set(Object.keys(SURTIDA));
  const setVariantes = new Set([].concat(...Object.values(SURTIDA)));

  /* ¿Este artículo admite unidades sueltas?
     Dos motivos distintos para que sí:
       · se vende suelto (un kiosco lleva 3 repelentes, no una caja)
       · es variante de una familia que se arma surtida (las unidades
         existen adentro de la caja aunque no se vendan de a una)
     Todo lo demás va solo por caja cerrada. */
  function admiteUnidades(ean) {
    const e = String(ean);
    return setSuelto.has(e) || setVariantes.has(e);
  }

  function seVendeSuelto(ean) { return setSuelto.has(String(ean)); }
  function admiteSurtida(familiaKey) { return setSurtida.has(String(familiaKey)); }
  function soloCajaCerrada(familiaKey) { return setSoloCaja.has(String(familiaKey)); }

  function familiaDeVariante(ean) {
    const e = String(ean);
    for (const fk of Object.keys(SURTIDA)) {
      if (SURTIDA[fk].includes(e)) return fk;
    }
    return null;
  }
  global.Formatos = {
    SUELTO, SURTIDA, SOLO_CAJA, admiteUnidades, seVendeSuelto, admiteSurtida, soloCajaCerrada, familiaDeVariante,
  };

  if (typeof module !== "undefined" && module.exports) module.exports = global.Formatos;

})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   STOCK — versión CONECTADA al servidor compartido (misma interfaz que
   stock-store.js). La usan las pantallas del sistema compartido.

   Las reglas no viven acá: viven en la base (supabase-prueba/migraciones/
   001_queruclor_stock.sql), probadas operación por operación contra
   stock-store.js. Este archivo solo traduce la interfaz de siempre a esas
   funciones. Ningún movimiento queda guardado solo en el navegador.
   ═══════════════════════════════════════════════════════════════════ */
(function (global) {
  if (!global.QRSrv) return;               // sin conexión-local, no hay nada que hacer
  const S = global.QRSrv;
  const num = n => Math.max(0, Math.round(Number(n) || 0));
  const iso = f => (f ? new Date(f).toISOString() : undefined);

  /* Una foto del stock entero (202 artículos): cada dibujo pregunta muchas
     veces, y así es una sola consulta. Cualquier escritura la renueva. */
  function foto() {
    const filas = S.get("qr_estado", "select=*");
    const m = {};
    for (const f of filas || []) m[f.ean] = f;
    return m;
  }
  const estadoDe = ean => foto()[String(ean)] || null;
  function ucDe(ean) {
    const e = estadoDe(ean);
    if (e && e.uc > 0) return e.uc;
    const ficha = global.Catalogo ? Catalogo.buscar(ean) : null;
    return (ficha && Number(ficha.uc)) || 0;
  }
  function fisico(ean) {
    const e = estadoDe(ean);
    if (!e || !e.incorporado) return { cajas: 0, sueltas: 0, uc: ucDe(ean), existe: false };
    return { cajas: num(e.fisico_cajas), sueltas: num(e.fisico_sueltas), uc: e.uc || ucDe(ean), existe: true };
  }
  function reservado(ean) {
    const r = S.get("qr_reservas", "estado=eq.reservada&select=ean,cajas,unidades");
    let cajas = 0, unidades = 0;
    for (const x of r || []) if (x.ean === String(ean)) { cajas += num(x.cajas); unidades += num(x.unidades); }
    return { cajas, unidades };
  }
  function disponible(ean) {
    const e = estadoDe(ean);
    if (!e) return { cajas: 0, unidades: 0, uc: ucDe(ean) };
    return { cajas: e.cajas, unidades: e.unidades, uc: e.uc };
  }
  function estado(ean) {
    const d = disponible(ean), f = fisico(ean);
    return {
      ean: String(ean), uc: d.uc, cajas: d.cajas, unidades: d.unidades, incorporado: f.existe,
      hayCaja: d.cajas > 0, haySuelto: d.unidades > 0, ultimaCaja: d.cajas === 1, escaso: d.cajas > 0 && d.cajas <= 3,
      texto: d.cajas > 0 ? (d.cajas === 1 ? "última caja" : "quedan " + d.cajas + " cajas")
        : (d.unidades > 0 ? "sin cajas cerradas · quedan " + d.unidades + " unidades" : "sin stock"),
    };
  }
  function todos() { return Object.values(foto()).filter(e => e.incorporado).map(e => estado(e.ean)); }
  function movimientos(ean) {
    const l = S.get("qr_movimientos", (ean ? "ean=eq." + encodeURIComponent(ean) + "&" : "") + "order=creado.asc") || [];
    return l;
  }

  /* ── Escrituras: una función de la base cada una ───────────────── */
  const recibir = o => S.rpc("qr_recibir", { p_ean: String(o.ean), p_cajas: num(o.cajas), p_sueltas: num(o.sueltas),
    p_remito: o.remito || null, p_quien: o.quien || "", p_motivo: o.motivo || null, p_fecha: iso(o.fecha), p_id: o.id || null });
  const contar = o => S.rpc("qr_contar", { p_ean: String(o.ean), p_cajas: num(o.cajas), p_sueltas: num(o.sueltas),
    p_quien: o.quien || "", p_fecha: iso(o.fecha), p_id: o.id || null });
  const ajustar = o => S.rpc("qr_ajustar", { p_ean: String(o.ean), p_cajas: Math.round(Number(o.cajas) || 0), p_sueltas: Math.round(Number(o.sueltas) || 0),
    p_motivo: o.motivo || "sin motivo", p_quien: o.quien || "", p_fecha: iso(o.fecha), p_id: o.id || null });
  const devolver = o => S.rpc("qr_devolver", { p_ean: String(o.ean), p_cajas: num(o.cajas), p_sueltas: num(o.sueltas),
    p_pedido: o.pedido != null ? String(o.pedido) : null, p_nc: o.nc || null, p_sana: o.sana !== false, p_quien: o.quien || "",
    p_fecha: iso(o.fecha), p_id: o.id || null });
  const reservar = (pedidoId, items, opts) => S.rpc("qr_reservar", { p_pedido: String(pedidoId), p_items: items || [], p_vendedor: (opts && opts.vendedor) || null });
  const liberar = (pedidoId, ean, quien) => S.rpc("qr_liberar", { p_pedido: String(pedidoId), p_ean: String(ean), p_quien: quien || "" });
  const despachar = (pedidoId, quien) => S.rpc("qr_despachar", { p_pedido: String(pedidoId), p_quien: quien || "" });
  /* Antes de despachar: la reserva baja a lo que de verdad sale (nunca sube). */
  const ajustarReserva = (pedidoId, items, quien) => S.rpc("qr_reserva_ajustar", { p_pedido: String(pedidoId), p_items: items || [], p_quien: quien || "" });
  const aRevisar = () => S.get("qr_a_revisar", "order=creado.asc", 0) || [];
  const reservasColgadas = dias => S.rpc("qr_reservas_colgadas", { p_dias: dias || 3 }) || [];

  global.Stock = {
    fisico, reservado, disponible, estado, todos,
    recibir, contar, ajustar, devolver,
    reservar, liberar, despachar, ajustarReserva,
    movimientos, aRevisar, reservasColgadas, ucDe,
    _reset: () => { throw new Error("En el sistema compartido el stock no se borra desde una pantalla."); },
    _claves: {}, _remoto: true,
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   ESCÁNER DE STOCK — contar y recibir son la misma operación

   El empleado apunta la cámara a un código y dice cuánto hay. Lo único
   que cambia es qué hace el sistema con ese número:

     CONTAR   → «hay 14 cajas»    → FIJA el físico en 14
     RECIBIR  → «entraron 20»     → SUMA 20 al físico

   Misma pantalla, mismo gesto. Por eso la pantalla del conteo físico
   cubre también la recepción de mercadería sin trabajo extra — y por eso
   el día que llegue el camión se puede cargar stock aunque el lector de
   remitos todavía no exista.

   EL CÓDIGO DICE SOLO SI ES CAJA O UNIDAD. Verificado sobre los 202
   productos de la lista: cada uno tiene EAN13 (envase suelto) y DUN14
   (caja), y ningún código es ambiguo — no hay uno que sea EAN de un
   producto y DUN de otro. Así que nunca hay que preguntarle al empleado
   qué escaneó, y ese es justo el error humano que queríamos sacar.
   ═══════════════════════════════════════════════════════════════════ */
(function (global) {

  /* ── Índice de códigos ────────────────────────────────────────────
     Se arma una vez desde la lista del proveedor. El código de caja NO se
     puede calcular desde el de unidad: el proveedor usa indicador de
     empaque 1, 2 y 3 según el producto, así que la tabla es obligatoria. */
  let INDICE = null;

  /* 01/11/2026: el mismo criterio que la base (qr_prep_resolver, migración 020).
     Un código que apareciera para dos presentaciones NO se resuelve solo: queda
     «ambiguo» con sus opciones y la pantalla pide elegir (no se mueve stock). */
  function construirIndice() {
    const idx = new Map();
    const base = global.CATALOGO_BASE;
    const lista = (base && base.productos) || [];
    const poner = (k, f) => {
      const ya = idx.get(k);
      if (!ya) return idx.set(k, f);
      const ops = ya.tipo === "ambiguo" ? ya.opciones : [ya];
      idx.set(k, { tipo: "ambiguo", opciones: ops.concat([f]) });
    };

    for (const p of lista) {
      const ean = String(p.ean || "").trim();
      const dun = String(p.dun || "").trim();
      const ficha = {
        ean, dun, uc: Number(p.uc) || 1,
        nombre: p.nombreCompleto || p.nombre || ean,
        marca: p.marca || "",
      };
      const dunOk = /^\d{12,14}$/.test(dun) && codigoValido(dun);
      /* «CAJA X 1» (U/C 1 sin DUN, p. ej. los polvos de 3 y 6 kg): la bolsa ES la
         caja. Su EAN13 identifica la presentación completa; no se inventa un DUN. */
      const uno = ficha.uc === 1 && !dunOk;
      if (/^\d{8,14}$/.test(ean)) poner(ean.replace(/^0+/, ""), { ...ficha, tipo: uno ? "caja" : "unidad", unoPorCaja: uno });
      /* Los DUN rotos de la lista vienen como "26": se descartan acá para
         que no generen un match falso contra cualquier cosa. */
      if (dunOk) poner(dun.replace(/^0+/, ""), { ...ficha, tipo: "caja" });
    }
    return idx;
  }
  /* Dígito de control GTIN (8, 12, 13 o 14 dígitos). */
  function codigoValido(c) {
    c = String(c || "");
    if (!/^\d+$/.test(c) || ![8, 12, 13, 14].includes(c.length)) return false;
    let s = 0;
    for (let i = 1; i < c.length; i++) s += Number(c[c.length - 1 - i]) * (i % 2 === 1 ? 3 : 1);
    return (10 - s % 10) % 10 === Number(c[c.length - 1]);
  }

  function indice() {
    if (!INDICE) INDICE = construirIndice();
    return INDICE;
  }

  /* Busca un código escaneado. Devuelve el artículo y si lo que se leyó
     identifica una CAJA o una UNIDAD suelta. */
  function identificar(codigo) {
    const c = String(codigo || "").replace(/\D/g, "");
    if (!c) return null;

    /* Los códigos se comparan sin ceros a la izquierda: algunos lectores agregan
       o comen el cero inicial (EAN13 leído como GTIN-14, UPC-A de 12). */
    const i = indice();
    const k = c.replace(/^0+/, "");
    if (k && i.has(k)) return i.get(k);
    return null;
  }
  /* ¿Lo que se leyó parece un código mal leído (falla el dígito de control)? */
  function malLeido(codigo) {
    const c = String(codigo || "").replace(/\D/g, "");
    return [8, 12, 13, 14].includes(c.length) && !codigoValido(c);
  }

  function sinCodigo() {
    const rotos = [];
    const base = global.CATALOGO_BASE;
    for (const p of ((base && base.productos) || [])) {
      const dun = String(p.dun || "").trim();
      const dunOk = /^\d{12,14}$/.test(dun) && codigoValido(dun);
      /* Con U/C 1 el EAN13 de la bolsa identifica la caja: no falta nada. */
      if ((Number(p.uc) || 1) === 1 && !dunOk && /^\d{8,14}$/.test(String(p.ean || "").trim())) continue;
      if (!dunOk) rotos.push({ ean: p.ean, nombre: p.nombreCompleto || p.nombre, dun: p.dun });
    }
    return rotos;
  }

  /* ── Cámara ───────────────────────────────────────────────────────
     Se usa BarcodeDetector, que en Android va nativo y es el caso real
     (la app la usan desde el celular del depósito). Donde no exista, la
     pantalla cae al ingreso manual, que además es lo que necesita el
     lector USB de la PC: ese escribe los dígitos y un Enter. */
  function hayCamara() {
    return !!(global.BarcodeDetector && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  async function abrirCamara(video, alLeer) {
    if (!hayCamara()) throw new Error("Este dispositivo no puede leer códigos con la cámara");

    const detector = new BarcodeDetector({
      formats: ["ean_13", "itf", "code_128", "ean_8", "upc_a"],
    });

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 } },
    });
    video.srcObject = stream;
    await video.play();

    let vivo = true;
    let ultimo = "", ultimoEn = 0;

    const loop = async () => {
      if (!vivo) return;
      try {
        const codigos = await detector.detect(video);
        if (codigos && codigos.length) {
          const c = String(codigos[0].rawValue || "").replace(/\D/g, "");
          const t = Date.now();
          /* Anti-rebote: la cámara lee el mismo código 20 veces por
             segundo. Sin esto, apoyar el celular sobre una caja cargaría
             veinte movimientos. */
          if (c && (c !== ultimo || t - ultimoEn > 2500)) {
            ultimo = c; ultimoEn = t;
            alLeer(c);
          }
        }
      } catch (e) { /* un frame que no se pudo leer no es un problema */ }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);

    return () => {
      vivo = false;
      try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
      video.srcObject = null;
    };
  }

  /* ── Quién está usando el celular ─────────────────────────────────
     El celular del depósito es uno solo y lo comparten dos personas. Si
     el nombre queda pegado del turno anterior, todo lo que hace el
     segundo queda registrado con el nombre del primero — que es peor que
     no registrar nada, porque el día que falte una caja se le va a ir a
     preguntar al que no fue.

     Por eso vuelve a preguntar sola después de un rato sin uso. Con dos
     botones cuesta un toque. */
  const K_QUIEN = "qr_stock_quien_v1";
  const MINUTOS_VIGENCIA = 60;

  function quien() {
    try {
      const q = JSON.parse(localStorage.getItem(K_QUIEN) || "null");
      if (!q || !q.nombre) return null;
      if (Date.now() - q.desde > MINUTOS_VIGENCIA * 60000) return null;
      return q.nombre;
    } catch (e) { return null; }
  }

  function setQuien(nombre) {
    localStorage.setItem(K_QUIEN, JSON.stringify({ nombre, desde: Date.now() }));
    return nombre;
  }

  function tocarQuien() {
    const q = quien();
    if (q) setQuien(q);            // renueva la vigencia mientras trabaja
    return q;
  }

  global.StockEscaner = {
    identificar, indice, sinCodigo, malLeido, codigoValido,
    hayCamara, abrirCamara,
    quien, setQuien, tocarQuien,
    OPERARIOS: ["RODRIGO", "ADRIÁN"],
  };

  if (typeof module !== "undefined" && module.exports) module.exports = global.StockEscaner;

})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   DEVOLUCIONES — la misma pantalla en Stock, Caja y Facturación

   Un caso de devolución tiene dos pasos separados, cada uno con su botón:

     · «Confirmar recepción» → efecto FÍSICO. Lo hace quien tiene la caja
                               adelante (Stock, Laura en Caja o Facturación)
                               identificando la caja por su código
                               (ML-<pedido>-<nnn>: lector, cámara o escrito).
                               Lo sano vuelve a la venta; lo dañado a
                               «a revisar».
     · «Emitir nota»         → efecto en la CUENTA. Solo con la recepción
                               registrada (la base lo exige, se use la
                               pantalla que se use). No mueve stock.

   Sin código (etiqueta ilegible o histórica, unidades sueltas de una caja
   abierta) se recibe contra lo despachado en el remito, con un motivo que
   queda registrado.

   Tres listas, iguales en las tres pantallas: «Por recibir», «Recibidas,
   falta nota» e «Historial».

   Nada se decide acá: todo pasa por UNA función de la base
   (qr_dev_operar) que pone el tope de lo despachado, reconoce las cajas
   ya escaneadas y no repite una operación aunque se mande dos veces.
   Cada operación lleva su propia identidad; si se corta la conexión, el
   reintento manda la MISMA y la base la reconoce.
   ═══════════════════════════════════════════════════════════════════ */
(function (global) {

  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const money = n => "$" + (Math.round((Number(n) || 0) * 100) / 100)
    .toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const hora = d => d ? new Date(d).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  const cant = (c, s) => [c ? c + " caja" + (c === 1 ? "" : "s") : "", s ? s + " un." : ""].filter(Boolean).join(" + ") || "0";
  const nuevoOp = modo => "op|" + modo + "|" + Date.now().toString(36) + "|" + Math.random().toString(36).slice(2, 8);
  const ORIGEN = { celular: "Reparto", reparto: "Reparto", stock: "Stock", caja: "Caja", facturacion: "Facturación" };
  const origen = o => ORIGEN[o] || o || "—";

  /* Por qué no se tiene el código de la caja. «Otro» pide escribirlo. */
  const MOTIVOS = [
    "Etiqueta ilegible o arrancada",
    "Etiqueta histórica (sin número de caja)",
    "Volvieron unidades sueltas de una caja abierta",
  ];

  /* «ML-1042-003» → caja 003 del pedido 1042 · «ML-1042» (etiqueta vieja) →
     pedido. La etiqueta de TOTAL («ML|1042|…») no se acepta a propósito: es
     la de la carga de reparto. El lector USB en teclado español cambia a
     veces el guion: se tolera. */
  function leerCodigo(crudo) {
    const s = String(crudo == null ? "" : crudo).trim();
    if (s.indexOf("|") >= 0) return null;
    let m = s.match(/^ML[^A-Za-z0-9]*([0-9]+)[^A-Za-z0-9]+([0-9]{3,})\s*$/i);
    if (m) return { pedido: m[1], bulto: "ML-" + m[1] + "-" + m[2] };
    m = s.match(/^ML[^A-Za-z0-9]*([A-Za-z0-9][A-Za-z0-9_]*)\s*$/i);
    if (m) return { pedido: m[1], bulto: null };
    return null;
  }

  /* Promedio máximo entre teclas para tomar la entrada como del lector (los lectores HID mandan cada
     carácter en pocos milisegundos; tipear rápido ronda 80-150 ms). */
  const LECTOR_MS = 35;

  /* Recepciones hechas en OTRO puesto que esperan la nota: una por operación de recepción. */
  function recepcionesAjenas(lista, modo) {
    const out = [];
    (lista || []).forEach(c => (c.recepciones || []).forEach(r => {
      if (!r.origen || r.origen === modo || r.origen === "reparto" || r.origen === "celular") return;
      const its = r.items || [];
      const cajas = its.reduce((a, i) => a + (Number(i.cajas) || 0), 0), sueltas = its.reduce((a, i) => a + (Number(i.sueltas) || 0), 0);
      const nombre = i => i.nombre || ((c.items || []).find(x => x.ean === i.ean) || {}).nombre || i.ean;
      const arts = [...new Set(its.map(nombre))].join(", ");
      out.push({ c, k: c.id + "|" + (r.op || r.fecha), quien: r.quien || "—", fecha: r.fecha, origen: r.origen, cajas: cajas || (sueltas ? 0 : 1),
        que: (cajas ? cajas + " caja" + (cajas === 1 ? "" : "s") : "") + (cajas && sueltas ? " y " : "") + (sueltas ? sueltas + " unidad" + (sueltas === 1 ? "" : "es") : "") + (arts ? " de " + arts : "") });
    }));
    return out.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  }

  function montar(raiz, cfg) {
    const modo = cfg.modo;                       // "stock" | "caja" | "facturacion"
    const emiteNota = modo !== "stock";
    const quien = () => (cfg.quien && cfg.quien()) || "";
    const S = global.QRSrv;
    let ped = null, cajas = [], manual = {}, op = nuevoOp(modo), msg = null, ocupado = false, opPend = null;
    let vista = "recibir", sinCod = { abierto: false, motivo: "", otro: "" }, casoSel = null, motivoDif = "";
    /* Cuándo se redibujó solo (por algo que hizo otro equipo). Un toque que
       llega justo después pudo haber apuntado a otro renglón. */
    let refrescadoAfuera = 0;
    const ACCIONES_CON_EFECTO = ["recibir", "recibir-distinto", "nc", "nc-directo", "liberar", "descartar"];

    if (!S) { raiz.innerHTML = `<p class="dv-nota">Las devoluciones necesitan conexión con el servidor.</p>`; return {}; }

    const rpc = (fn, a) => S.rpc(fn, a);
    function aviso(tipo, txt) { msg = { tipo, txt }; pintar(); }
    const limpiar = () => { cajas = []; manual = {}; op = nuevoOp(modo); opPend = null; sinCod = { abierto: false, motivo: "", otro: "" }; casoSel = null; motivoDif = ""; };
    /* Lo declarado por el repartidor que todavía falta recibir (casos abiertos de este pedido). */
    const declaradosPend = () => ((ped && ped.casos) || []).filter(c => c.estado_fisico !== "recibida");
    const codigosDeclarados = () => new Set(declaradosPend().flatMap(c => (c.items || []).filter(i => i.bulto).map(i => i.bulto)));

    function cargarPedido(id) {
      try { ped = rpc("qr_dev_pedido", { p_pedido: String(id) }); }
      catch (e) { return aviso("mal", "Sin conexión con el servidor: no se pudo leer el pedido. " + e.message); }
      if (!ped) { aviso("mal", "El pedido " + id + " no tiene remito emitido: no hay nada despachado para devolver."); return false; }
      return true;
    }

    function escanear(txt, entrada) {
      refrescadoAfuera = 0;                    // lo que se ve ahora lo pidió la persona
      const c = leerCodigo(txt);
      if (!c) {
        /* Con un pedido abierto, el código de barras del ARTÍCULO (EAN o DUN)
           sirve para elegir qué volvió sin código de caja: abre «sin código». */
        if (ped && global.StockEscaner) {
          const f = StockEscaner.identificar ? StockEscaner.identificar(String(txt).trim()) : null;
          if (f && f.tipo === "ambiguo") {
            msg = { tipo: "mal", txt: "Ese código corresponde a más de un artículo del catálogo: no se asigna por parecido. Elegí el artículo por nombre, o indicá las unidades «sin código» con el motivo." };
            return pintar();
          }
          const a = f && ped.articulos.find(x => x.ean === f.ean);
          if (a) {
            const k = f.tipo === "caja" ? "cajas" : "sueltas";
            manual[a.ean] = manual[a.ean] || { cajas: 0, sueltas: 0, sana: true }; manual[a.ean][k]++;
            sinCod.abierto = true;
            msg = { tipo: "info", txt: "Es el código del artículo, no el de la caja: elegí por qué no tenés el código de la caja." };
            return pintar();
          }
        }
        if (/^https?:/i.test(String(txt).trim())) return aviso("mal", "Ese es el QR de contacto con Administración. Escaneá el código de barras de la caja o el QR chico que está debajo de las barras.");
        return aviso("mal", "No reconozco ese código. Escaneá la etiqueta de la caja (barras o QR chico).");
      }
      if (ped && String(ped.pedido_id) !== String(c.pedido)) {
        /* 20/10/2026: una caja de OTRO pedido no se suma a este ni cambia la pantalla sola. */
        msg = { tipo: "mal", txt: "Esa caja es de otro pedido (#" + c.pedido + "), no del que estás recibiendo (#" + ped.pedido_id + " · " + ped.cliente_nombre + "). No se sumó.", abrir: c.pedido };
        return pintar();
      }
      if (!ped) {
        limpiar();
        if (!cargarPedido(c.pedido)) return;
      }
      if (c.bulto) {
        if (cajas.some(x => x.codigo === c.bulto)) return aviso("ojo", "Esa caja ya está en la lista: no se suma dos veces.");
        let info = null;
        try { info = rpc("qr_bulto_info", { p_codigo: c.bulto }); } catch (e) { return aviso("mal", "Sin conexión: " + e.message); }
        if (!info || info.estado !== "activo") return aviso("mal", "Ese código no está registrado como caja de este pedido.");
        /* Caja surtida: vuelve lo que la base registró que lleva. Si no tiene
           el detalle por caja (pedido viejo), no se adivina: se eligen las
           unidades «sin código», con el motivo. */
        const surtida = info.tipo && info.tipo !== "cerrada";
        if (surtida && info.contenido_estado !== "por_caja") {
          sinCod.abierto = true;
          return aviso("info", "Esa caja surtida no tiene registrado qué lleva adentro: indicá abajo las unidades que volvieron y el motivo.");
        }
        const lleva = surtida ? " · lleva " + (info.contenido || []).map(u => u.sueltas + " " + (u.nombre || u.ean)).join(" + ") : "";
        /* ¿Es la caja declarada, o llegó otra en su lugar? */
        const decl = codigosDeclarados();
        const distinta = !(info.devolucion && (info.devolucion.declarada || info.devolucion.recibida)) && decl.size > 0 && !decl.has(c.bulto);
        cajas.push({ codigo: c.bulto, ean: info.ean, nombre: (surtida ? "Surtida · " : "") + info.nombre + lleva, sana: true, dev: info.devolucion, distinta, entrada: entrada || "lector" });
        casoSel = null;
        msg = info.devolucion && info.devolucion.recibida
          ? { tipo: "ojo", txt: "Esa caja ya se recibió: no vuelve a sumar stock." + (emiteNota ? " Si falta la nota, está abajo en el caso." : "") }
          : distinta ? { tipo: "info", txt: "Esta caja no es la que declaró el repartidor. Abajo elegí si llegó en lugar de lo declarado (con un motivo) o además." }
          /* El lector puede ser un teclado USB o la cámara; acá no se distingue uno de otro, solo se confirma
             qué caja quedó identificada antes de confirmar la recepción. */
          : { tipo: entrada === "manual" ? "ojo" : "ok", txt: "Caja identificada · " + info.nombre + (entrada === "manual" ? " · el código se escribió a mano (no lo leyó el lector): queda marcado para revisión" : "") };
      } else {
        sinCod.abierto = true;
        msg = { tipo: "info", txt: "Etiqueta sin número de caja: indicá qué volvió y el motivo (o escaneá el código de cada caja)." };
      }
      pintar();
    }

    function abrirPedido(id) {
      limpiar(); msg = null;
      if (cargarPedido(id)) pintar();
    }

    /* ── Operar: siempre la misma función de la base ─────────────── */
    function operar(o, okTxt) {
      if (ocupado) return;
      const q = quien();
      if (!q) return aviso("mal", "Falta quién lo hace.");
      ocupado = true;
      const pid = String(o.pedido_id || (ped && ped.pedido_id) || "");
      const cuerpo = Object.assign({ op: o.op || op, pedido_id: pid, quien: q, origen: modo }, o);
      let r;
      try { r = rpc("qr_dev_operar", { o: cuerpo }); }
      catch (e) {
        ocupado = false; opPend = cuerpo;
        return aviso("mal", "NO se guardó: " + e.message + " Tocá «Reintentar» cuando vuelva la conexión (no se duplica).");
      }
      ocupado = false; opPend = null;
      if (!r || !r.ok) return aviso("mal", (r && r.motivo) || "La base no aceptó la operación.");
      const pedAntes = ped;
      limpiar();
      if (pedAntes) cargarPedido(pid);
      const nc = r.nc && r.nc.numero ? " Nota de crédito " + r.nc.numero + " por " + money(r.nc.total) + "." : "";
      msg = { tipo: r.sin_cambios ? "ojo" : "ok", txt: r.sin_cambios ? r.motivo : (r.repetida ? "Ya estaba registrado: no se repitió. " : "") + okTxt + nc, nc: r.nc && r.nc.numero ? r.nc.numero : null };
      pintar();
      if (cfg.alCambiar) try { cfg.alCambiar(r); } catch (e) {}
    }
    /* La recepción sin la lectura de la etiqueta (sin código, o con el código escrito a mano) abre un aviso
       para Administración desde la base (migración 015), al guardarse la operación con `entrada`. */
    const entradaDe = () => { const vivas = cajas.filter(c => !(c.dev && c.dev.recibida)); return vivas.some(c => c.entrada === "manual") ? "manual" : vivas.some(c => c.entrada === "camara") ? "camara" : "lector"; };
    const itemsActuales = () => {
      const out = cajas.filter(c => !(c.dev && c.dev.recibida)).map(c => c.reacondicionada
        ? { bulto: c.codigo, ean: c.ean, sana: true, reacondicionada: true, unidades: c.unidades, sin_danio: !!c.sinDanio }
        : { bulto: c.codigo, ean: c.ean, sana: c.sana });
      Object.keys(manual).forEach(ean => { const m = manual[ean]; if (m.cajas || m.sueltas) out.push({ ean, cajas: m.cajas, sueltas: m.sueltas, sana: m.sana }); });
      return out;
    };
    const motivoTxt = () => sinCod.motivo === "otro" ? sinCod.otro.trim() : sinCod.motivo;

    /* ── Pintar ────────────────────────────────────────────────── */
    function pintar() {
      const m = msg ? `<div class="dv-msg ${msg.tipo}" role="status">${esc(msg.txt)}${opPend ? ` <button type="button" class="dv-b" data-a="reintentar">Reintentar</button>` : ""}${msg.abrir ? ` <button type="button" class="dv-b" data-a="abrir" data-ped="${esc(msg.abrir)}">Abrir ese pedido</button>` : ""}${msg.nc && global.NotaCreditoDoc ? ` <button type="button" class="dv-b" data-a="ver-nota" data-nc="${esc(msg.nc)}">Ver nota</button> <button type="button" class="dv-b" data-a="ver-nota" data-nc="${esc(msg.nc)}" title="Abre la nota para imprimirla de nuevo">Reimprimir</button>` : ""}</div>` : "";
      const cuerpo = !ped ? bandejaHTML() + (modo === "stock" ? revisarHTML() : "") : pedidoHTML();
      raiz.innerHTML = `
        <label class="dv-scan-l" for="dvCod">Código de la caja</label>
        <div class="dv-scan"><input type="text" id="dvCod" placeholder="Escaneá la etiqueta de la caja (código de barras o QR)" autocomplete="off" inputmode="text" aria-label="Código de la caja">
          <button type="button" class="dv-b" data-a="buscar">Buscar</button>
          <button type="button" class="dv-b dv-nov" data-a="novedad" ${pillOn ? "" : "hidden"}>Hay novedades · Actualizar</button>
          ${"BarcodeDetector" in global ? `<button type="button" class="dv-b" data-a="camara" aria-label="Usar la cámara">📷</button>` : ""}</div>
        <video id="dvVideo" class="dv-video" playsinline muted hidden></video>
        ${m}${cuerpo}`;
      const inp = raiz.querySelector("#dvCod");
      /* 26/10/2026: el código vale si lo lee el lector. Pegar o arrastrar no se acepta, y una entrada
         tipeada a mano (el lector «escribe» todo en milisegundos; una persona no) se marca para revisión.
         El navegador no distingue el lector del teclado con certeza: es una señal, no una prueba. */
      let teclas = [];
      inp.addEventListener("beforeinput", e => { if (/^insertFrom(Paste|Drop)/.test(e.inputType || "")) { e.preventDefault(); aviso("mal", "El código no se puede pegar: escaneá la etiqueta. Si no se lee, usá «No puedo leer el código»."); } });
      inp.addEventListener("paste", e => { e.preventDefault(); aviso("mal", "El código no se puede pegar: escaneá la etiqueta. Si no se lee, usá «No puedo leer el código»."); });
      inp.addEventListener("drop", e => e.preventDefault());
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          const v = inp.value; inp.value = "";
          const n = teclas.length, prom = n > 1 ? (teclas[n - 1] - teclas[0]) / (n - 1) : Infinity;
          teclas = [];
          if (v.trim()) escanear(v, n >= 4 && prom <= LECTOR_MS ? "lector" : "manual");
          return;
        }
        if (e.key.length === 1) { if (!inp.value) teclas = []; teclas.push(e.timeStamp || performance.now()); }
        else if (e.key === "Backspace" || e.key === "Delete") teclas.push(Infinity);
      });
      setTimeout(() => { if (raiz.offsetParent && (document.activeElement === document.body || !document.activeElement)) inp.focus(); }, 0);
    }

    function chip(txt, cls) { return `<span class="dv-chip ${cls}">${esc(txt)}</span>`; }
    function estadoChips(c) {
      const out = [];
      if (c.estado_fisico === "recibida") out.push(c.estado === "acreditada" ? chip("Caja recibida", "bien") : chip("Caja recibida: falta emitir la nota", "ojo"));
      else if (c.estado_fisico === "parcial") out.push(chip("Recibida en parte: falta recibir el resto", "ojo"));
      else out.push(chip("Falta recibir la caja", "ojo"));
      if (c.estado === "acreditada") out.push(chip("Nota " + (c.nc || "emitida"), "bien"));
      return out.join("");
    }
    /* Qué volvió, con el código interno de cada caja a la vista. */
    function detalle(c) {
      const nombre = i => i.nombre || ((ped && ped.articulos.find(a => a.ean === i.ean)) || {}).nombre || i.ean;
      return `<ul class="dv-det">${(c.items || []).map(i => `<li>${cant(i.cajas, i.sueltas)} · ${esc(nombre(i))}${i.bulto ? " · con código de caja" : ""}${i.sana === false ? " · dañada" : ""}</li>`).join("")}</ul>`;
    }
    /* Quién la recibió y cómo. Si la recibió otra persona, se ve acá. */
    function recepcionesHTML(c) {
      const l = c.recepciones || agruparRecibido(c);
      if (!l.length) return "";
      /* 26/10/2026: sin los códigos (se ve cuántas cajas se leyeron) y, si el código se escribió a mano
         en vez de leerlo, se dice. Eso sale de la operación guardada (qr_devolucion_ops.datos.entrada). */
      const ops = [...new Set(l.map(r => String(r.op || "").split("|").slice(0, 4).join("|")).filter(Boolean))];
      let datosOp = {};
      if (ops.length) { try { (S.get("qr_devolucion_ops", "select=id,datos&id=in.(" + ops.map(encodeURIComponent).join(",") + ")", 30) || []).forEach(o => { datosOp[o.id] = o.datos || {}; }); } catch (e) {} }
      return `<div class="dv-rec">${l.map(r => { const dop = datosOp[String(r.op || "").split("|").slice(0, 4).join("|")] || {};
        const nC = (r.cajas || []).length;
        return `<div>Recibió <b>${esc(r.quien || "—")}</b> el ${hora(r.fecha)}${r.origen ? " desde " + esc(origen(r.origen)) : ""}${r.evidencia ? " · " + esc(r.evidencia) : ""}${nC ? " · " + nC + " caja" + (nC === 1 ? "" : "s") + " por código" : ""}${dop.entrada === "manual" ? ' · <span class="dv-chip ojo">código escrito a mano (no lo leyó el lector)</span>' : ""}</div>`; }).join("")}</div>`;
    }
    const agruparRecibido = c => {
      const g = {};
      (c.recibido || []).forEach(r => { const k = String(r.op || "").split("|").slice(0, 4).join("|"); if (!g[k]) g[k] = { quien: r.quien, fecha: r.fecha, op: k }; });
      return Object.keys(g).map(k => g[k]);
    };
    const verNotaBtn = c => c.nc && global.NotaCreditoDoc ? `<button type="button" class="dv-b" data-a="ver-nota" data-nc="${esc(c.nc)}">Ver nota</button>` : "";

    /* 25/10/2026: el vendedor ORIGINAL de cada remito (el de la venta), leído de la cuenta
       corriente: la bandeja no lo traía. Si no se puede leer, no se inventa. */
    let vendRemito = {};
    function cargarVendedores(l) {
      const faltan = [...new Set(l.map(c => c.remito).filter(r => r && !(r in vendRemito)))];
      if (!faltan.length) return;
      try {
        (S.get("qr_cuenta_movs", "select=comprobante,vendedor&tipo=eq.remito&comprobante=in.(" + faltan.map(encodeURIComponent).join(",") + ")", 30) || [])
          .forEach(f => { vendRemito[f.comprobante] = f.vendedor || ""; });
        faltan.forEach(r => { if (!(r in vendRemito)) vendRemito[r] = ""; });
      } catch (e) {}
    }
    function resumenNota(c) {
      const nombre = i => i.nombre || ((ped && ped.articulos.find(a => a.ean === i.ean)) || {}).nombre || i.ean;
      return `<div class="dv-resumen"><b>Resumen de la nota:</b> ${esc((c.items || []).map(i => cant(i.cajas, i.sueltas) + " " + nombre(i)).join(", "))}
        · <b>${money((c.valor || {}).bruto)}</b> con los precios del remito ${esc(c.remito || "")}${ped && String(ped.pedido_id) === String(c.pedido_id) && ped.saldo_cliente != null ? ` · saldo del cliente hoy ${money(ped.saldo_cliente)}` : ""}.
        No genera cobro ni devolución de dinero.</div>`;
    }
    function tarjeta(c, donde) {
      const vend = vendRemito[c.remito];
      const cab = donde === "pedido"
        ? `<b>${esc((c.items || []).map(i => cant(i.cajas, i.sueltas) + " " + (i.nombre || i.ean)).join(", "))}</b>`
        : `<b>${esc(c.cliente_nombre)} · pedido ${esc(c.pedido_id)} · remito ${esc(c.remito)}</b>${vend ? `<span class="dv-vend">Vendedor del remito: ${esc(vend)}</span>` : ""}`;
      let acc = "";
      const recibida = c.estado_fisico === "recibida";
      if (!recibida) {
        const cods = (c.items || []).filter(i => i.bulto).map(i => i.bulto);
        acc = donde === "pedido"
          ? `<span class="dv-nota">${cods.length ? "Escaneá arriba el código de la caja." : "Indicá arriba qué volvió."}</span>
             <button type="button" class="dv-lnk" data-a="sin-codigo-caso" data-caso="${esc(c.id)}">No puedo leer el código</button>`
          : `<button type="button" class="dv-b prim" data-a="abrir" data-ped="${esc(c.pedido_id)}">Recibir</button>`;
      } else if (c.estado !== "acreditada") {
        acc = (donde === "pedido" ? "" : `<button type="button" class="dv-b" data-a="abrir" data-ped="${esc(c.pedido_id)}">Ver pedido</button>`) +
          (emiteNota ? `<button type="button" class="dv-b prim" data-a="${donde === "pedido" ? "nc" : "nc-directo"}" data-caso="${esc(c.id)}" data-ped="${esc(c.pedido_id)}">Emitir nota ${money((c.valor || {}).bruto)}</button>`
                     : `<span class="dv-nota">La nota la emite Caja o Facturación.</span>`);
      } else {
        acc = verNotaBtn(c) + (donde === "pedido" ? "" : `<button type="button" class="dv-b" data-a="abrir" data-ped="${esc(c.pedido_id)}">Ver pedido</button>`);
      }
      return `<div class="dv-caso ${recibida && c.estado !== "acreditada" ? "dv-nc" : ""}" data-caso-id="${esc(c.id)}">
        <div class="dv-caso-h">${cab}
          <span>Declaró ${esc(c.quien || "—")} desde ${esc(origen(c.origen))} · ${hora(c.fecha)} · ${money((c.valor || {}).bruto)}</span></div>
        ${donde === "pedido" ? "" : detalle(c)}
        <div class="dv-caso-e">${estadoChips(c)}</div>
        ${recepcionesHTML(c)}
        ${emiteNota && recibida && c.estado !== "acreditada" ? resumenNota(c) : ""}
        ${(c.diferencias || []).map(d => `<div class="dv-dif-h">Llegó distinto de lo declarado · ${esc(d.quien || "—")} · ${hora(d.fecha)} · «${esc(d.motivo)}»<br>
          <small>Declarado: ${esc((d.declarado || []).map(i => cant(i.cajas, i.sueltas) + " " + (i.nombre || i.ean) + (i.bulto ? " (con código)" : "")).join(", "))} · Llegó: ${esc((d.recibido || []).map(i => cant(i.cajas, i.sueltas) + " " + (i.nombre || i.ean) + (i.bulto ? " (con código)" : "")).join(", "))}</small></div>`).join("")}
        <div class="dv-caso-a">${acc}</div></div>`;
    }

    /* 26/10/2026: lo que OTRO puesto ya recibió y guardó (por ejemplo Stock) y espera la nota se anuncia
       arriba de todo, con quién lo recibió, cuándo y qué. No es un registro aparte: sale de la misma bandeja
       («Recibidas, falta nota») y su «Emitir nota» es la operación de siempre (una por caso, con la recepción
       ya hecha). Desaparece sola, en todos los puestos, cuando se emite la nota. */
    function novedadesHTML(lista) {
      const l = recepcionesAjenas(lista, modo);
      if (!l.length) return "";
      const nCajas = l.reduce((a, x) => a + x.cajas, 0);
      const quienes = [...new Set(l.map(x => x.quien))].join(", ");
      return `<section class="dv-nov-rec" role="status" aria-live="polite">
        <div class="dv-nov-h"><span class="dv-nov-ic" aria-hidden="true">✓</span>
          <div><b>${nCajas} caja${nCajas === 1 ? "" : "s"} ya recibida${nCajas === 1 ? "" : "s"} en ${esc([...new Set(l.map(x => origen(x.origen)))].join(" y "))}</b>
            <span>Por ${esc(quienes)}. Falta emitir la nota de crédito.</span></div>
</div>
        ${l.map(x => `<div class="dv-nov-f">
          <div class="dv-nov-t"><b>${esc(x.c.cliente_nombre)}</b> · pedido ${esc(x.c.pedido_id)}<small>${esc(x.quien)} recibió ${esc(x.que)} el ${hora(x.fecha)} en ${esc(origen(x.origen))}</small></div>
          <button type="button" class="dv-b prim" data-a="nc-directo" data-caso="${esc(x.c.id)}" data-ped="${esc(x.c.pedido_id)}">Emitir nota ${money((x.c.valor || {}).bruto)}</button></div>`).join("")}
      </section>`;
    }
    function bandejaHTML() {
      let b;
      try { b = rpc("qr_dev_bandeja", {}) || {}; } catch (e) { return `<p class="dv-nota">Sin conexión: no se pueden ver las devoluciones.</p>`; }
      const l = { recibir: b.por_recibir || [], nota: b.falta_nota || [], historial: b.historial || [] };
      const tabs = [["recibir", "Por recibir", l.recibir.length], ["nota", "Recibidas, falta nota", l.nota.length], ["historial", "Historial", l.historial.length]];
      /* 25/10/2026: la suscripción a avisos de Windows no compite con el trabajo: enlace chico al pie. */
      const avisos = modo === "caja" && "Notification" in global && Notification.permission === "default"
        ? `<div class="dv-sec dv-pie"><button type="button" class="dv-lnk" data-a="avisos">Recibir un aviso de Windows en esta PC cuando llegue una devolución</button></div>` : "";
      const lista = l[vista];
      cargarVendedores(lista);
      const vacio = { recibir: "No hay cajas por recibir.", nota: "No hay devoluciones recibidas esperando nota.", historial: "Todavía no hay devoluciones cerradas." }[vista];
      return `${emiteNota ? novedadesHTML(l.nota) : ""}<div class="dv-tabs" role="tablist">${tabs.map(([k, t, n]) => `<button type="button" role="tab" class="dv-tab ${vista === k ? "on" : ""}" aria-selected="${vista === k}" data-a="vista" data-v="${k}">${t}${n != null ? ` <b>${n}</b>` : ""}</button>`).join("")}</div>
        ${lista.length ? lista.map(c => tarjeta(c, "bandeja")).join("") : `<p class="dv-nota">${vacio}</p>`}
        ${avisos}`;
    }

    function pedidoHTML() {
      const casos = ped.casos || [];
      const items = itemsActuales();
      const hayManual = items.some(i => !i.bulto);
      const pendDecl = declaradosPend();
      const escaneados = new Set(cajas.map(c => c.codigo));
      const distintas = cajas.filter(c => c.distinta && !(c.dev && c.dev.recibida));
      const motivoSel = `<select id="dvMotivo" aria-label="Motivo sin código"><option value="" ${sinCod.motivo ? "" : "selected"}>Elegí el motivo…</option>
          ${MOTIVOS.map(t => `<option ${sinCod.motivo === t ? "selected" : ""}>${esc(t)}</option>`).join("")}
          <option value="otro" ${sinCod.motivo === "otro" ? "selected" : ""}>Otro motivo</option></select>
        ${sinCod.motivo === "otro" ? `<input id="dvMotivoOtro" type="text" placeholder="Escribí el motivo" value="${esc(sinCod.otro)}">` : ""}`;
      const tablaRemito = conMan => `<div class="dv-tabla"><table><thead><tr><th>Artículo</th><th class="n">Salió</th><th class="n">Declarado</th><th class="n">Recibido</th>
          ${conMan ? `<th>Sin código: vuelve ahora</th>` : ""}</tr></thead><tbody>${ped.articulos.map(a => {
            const mm = manual[a.ean] || { cajas: 0, sueltas: 0, sana: true };
            return `<tr><td><b>${esc(a.nombre)}</b><small>${esc(a.ean)}</small></td>
              <td class="n">${cant(a.cajas, a.sueltas)}</td><td class="n">${cant(a.devuelto_cajas, a.devuelto_sueltas)}</td>
              <td class="n">${cant(a.recibido_cajas, a.recibido_sueltas)}</td>
              ${conMan ? `<td class="dv-man">${a.cajas ? `<label>cajas <input type="number" min="0" max="${a.cajas}" inputmode="numeric" data-ean="${esc(a.ean)}" data-k="cajas" value="${mm.cajas || ""}"></label>` : ""}
                ${a.sueltas ? `<label>un. <input type="number" min="0" max="${a.sueltas}" inputmode="numeric" data-ean="${esc(a.ean)}" data-k="sueltas" value="${mm.sueltas || ""}"></label>` : ""}
                <select data-ean="${esc(a.ean)}" data-k="sana" aria-label="Estado"><option value="1" ${mm.sana ? "selected" : ""}>sana</option><option value="0" ${mm.sana ? "" : "selected"}>dañada</option></select></td>` : ""}</tr>`;
          }).join("")}</tbody></table></div>`;
      /* 25/10/2026: los tres pasos a la vista (identificar → confirmar recepción → emitir nota),
         con lo hecho en verde y lo que toca ahora resaltado. Cuando todo está hecho, se oculta
         el formulario y queda el resultado con su historial. */
      const recibidoTodo = casos.length > 0 && casos.every(c => c.estado_fisico === "recibida") && !items.length;
      const notaTodo = recibidoTodo && casos.every(c => c.estado === "acreditada");
      const p1 = items.length > 0 || recibidoTodo;
      const pasos = [["Identificar la caja", p1 ? "hecho" : "ahora"],
        ["Confirmar recepción", recibidoTodo ? "hecho" : p1 ? "ahora" : "despues"],
        [emiteNota ? "Emitir nota de crédito" : "Nota de crédito (la emite Caja o Facturación)", notaTodo ? "hecho" : recibidoTodo ? (emiteNota ? "ahora" : "otro") : "despues"]];
      const ESTP = { hecho: "Hecho", ahora: "Ahora", despues: "Después", otro: "Otro puesto" };
      const pasosHTML = `<ol class="dv-pasos" aria-label="Pasos de la devolución">${pasos.map(([t, e], i) => `<li class="${e}" ${e === "ahora" ? 'aria-current="step"' : ""}><i>${e === "hecho" ? "✓" : i + 1}</i><span>${esc(t)}<small>${ESTP[e]}</small></span></li>`).join("")}</ol>`;
      const ncs = casos.filter(c => c.nc).map(c => c.nc);
      if (notaTodo) return `
        <div class="dv-cab">
          <div><b>Pedido ${esc(ped.pedido_id)}</b> · remito ${esc(ped.remito)}<br><span>${esc(ped.cliente_nombre)} · cliente ${esc(ped.cliente_id)} · vendedor del remito ${esc(ped.vendedor || "—")}</span></div>
          ${emiteNota ? `<div class="dv-saldo"><span>Saldo del cliente</span><b>${money(ped.saldo_cliente)}</b></div>` : ""}
          <button type="button" class="dv-b" data-a="cerrar">Volver a la lista</button>
        </div>
        ${pasosHTML}
        <div class="dv-final"><b>Devolución completa</b><span>Caja recibida y nota${ncs.length > 1 ? "s" : ""} ${esc(ncs.join(", "))} emitida${ncs.length > 1 ? "s" : ""}. No queda nada pendiente en este pedido.</span>
          ${ncs.map(n => global.NotaCreditoDoc ? `<button type="button" class="dv-b" data-a="ver-nota" data-nc="${esc(n)}">Ver nota ${esc(n)}</button><button type="button" class="dv-b" data-a="ver-nota" data-nc="${esc(n)}">Reimprimir</button>` : "").join("")}</div>
        <h4>Historial de este pedido</h4>${casos.map(c => tarjeta(c, "pedido")).join("")}`;
      return `
        <div class="dv-cab">
          <div><b>Pedido ${esc(ped.pedido_id)}</b> · remito ${esc(ped.remito)}<br><span>${esc(ped.cliente_nombre)} · cliente ${esc(ped.cliente_id)} · vendedor del remito ${esc(ped.vendedor || "—")}</span></div>
          ${emiteNota ? `<div class="dv-saldo"><span>Saldo del cliente</span><b>${money(ped.saldo_cliente)}</b></div>` : ""}
          <button type="button" class="dv-b" data-a="cerrar">Volver a la lista</button>
        </div>
        ${pasosHTML}
        ${pendDecl.length ? `<h4>Declarado por el repartidor</h4><div class="dv-decl">${pendDecl.map(c => `
          <div class="dv-decl-c"><span class="dv-decl-q">Declaró ${esc(c.quien || "—")} · ${hora(c.fecha)}</span>${(c.items || []).map(i => `
            <div class="dv-decl-i ${i.bulto && escaneados.has(i.bulto) ? "ok" : ""}"><b>${cant(i.cajas, i.sueltas)}</b><span>${esc(i.nombre || i.ean)}</span>
              ${i.bulto ? "" : `<i>sin código</i>`}
              <em>${i.bulto && escaneados.has(i.bulto) ? "✓ escaneada" : "escaneá su código"}</em></div>`).join("")}</div>`).join("")}</div>` : ""}
        ${cajas.length ? `<h4>Cajas identificadas por código</h4><div class="dv-cajas">${cajas.map((c, i) => {
            const uc = ((ped.articulos || []).find(a => a.ean === c.ean) || {}).uc || null;
            const estado = c.sana === false ? "0" : c.reacondicionada ? "2" : "1";
            return `
          <div class="dv-caja ${c.dev && c.dev.recibida ? "ya" : ""} ${c.distinta ? "distinta" : ""}"><b>Caja ${i + 1}${c.entrada === "manual" ? " · escrita a mano" : c.entrada === "camara" ? " · cámara" : " · leída"}</b><span>${esc(c.nombre)}${c.distinta ? " · <em>no es la declarada</em>" : ""}</span>
            ${c.dev && c.dev.recibida ? `<i>ya recibida</i>` : `
            <select data-i="${i}" class="dv-sana" aria-label="Estado de la caja">
              <option value="1" ${estado === "1" ? "selected" : ""}>cerrada y sana</option>
              <option value="2" ${estado === "2" ? "selected" : ""}>abierta, completa y sana (se cierra con cinta)</option>
              <option value="0" ${estado === "0" ? "selected" : ""}>abierta incompleta o dañada</option>
            </select>
            ${c.reacondicionada ? `<div class="dv-reac">
              <label>Unidades contadas en la caja${uc ? " (una caja completa lleva " + uc + ")" : ""}
                <input type="number" min="0" inputmode="numeric" class="dv-reac-u" data-i="${i}" value="${c.unidades != null ? c.unidades : (uc || "")}"></label>
              <label class="dv-reac-chk"><input type="checkbox" class="dv-reac-sd" data-i="${i}" ${c.sinDanio ? "checked" : ""}> Confirmo que ninguna unidad está dañada</label>
              <p class="dv-nota">Vuelve como caja completa recién al confirmar: se verifica contra el catálogo y queda registrado que se recibió abierta y reacondicionada (no es de fábrica).</p>
            </div>` : ""}`}
            <button type="button" class="dv-x" data-a="quitar" data-i="${i}" aria-label="Quitar">✕</button></div>`; }).join("")}</div>` : ""}
        ${distintas.length && pendDecl.length ? `<div class="dv-dif"><b>Llegó distinto de lo declarado</b>
          <div class="dv-dif-l"><span>Declarado: ${esc(pendDecl[0].items.map(i => cant(i.cajas, i.sueltas) + " " + (i.nombre || i.ean) + (i.bulto ? " (con código)" : "")).join(", "))}</span>
            <span>Llegó: ${esc(distintas.map(c => c.nombre).join(", "))}</span></div>
          <input id="dvMotivoDif" type="text" maxlength="140" placeholder="Motivo breve (ej.: el cliente devolvió otra caja)" value="${esc(motivoDif)}">
          <div class="dv-acc"><button type="button" class="dv-b" data-a="recibir">Llegó además de lo declarado</button>
            <button type="button" class="dv-b prim" data-a="recibir-distinto" data-caso="${esc(pendDecl[0].id)}">Registrar en lugar de lo declarado</button></div>
          <p class="dv-nota">La declaración original queda en el historial. La nota sale de lo que llegó, con los precios del remito.</p></div>` : ""}
        ${sinCod.abierto ? `<div class="dv-sincod"><b>Recepción sin código de caja</b><span>Indicá qué llegó: se controla contra lo que salió en el remito. El motivo queda registrado.</span>${motivoSel}${tablaRemito(true)}</div>` : ""}
        <div class="dv-acc">
          ${(distintas.length && pendDecl.length) || (recibidoTodo && !sinCod.abierto) ? "" : `<button type="button" class="dv-b prim" data-a="recibir" ${items.length ? "" : "disabled"}>Confirmar recepción${items.length ? " (" + items.length + ")" : ""}</button>`}
        </div>
        ${sinCod.abierto || recibidoTodo ? "" : `<div class="dv-sec"><button type="button" class="dv-lnk" data-a="sin-codigo">No puedo leer el código</button></div>`}
        <p class="dv-nota dv-ayuda">«Confirmar recepción» registra la mercadería en el depósito (lo sano vuelve a la venta, lo dañado a «a revisar»). ${emiteNota ? "La nota de crédito se emite aparte, con «Emitir nota»." : "La nota de crédito la emite Caja o Facturación."}${hayManual && !motivoTxt() ? " <b>Falta el motivo sin código.</b>" : ""}</p>
        ${sinCod.abierto ? "" : `<details class="dv-remito"><summary>Ver todo lo que salió en el remito</summary>${tablaRemito(false)}</details>`}
        ${casos.length ? `<h4>Casos de este pedido</h4>${casos.map(c => tarjeta(c, "pedido")).join("")}` : ""}`;
    }

    function revisarHTML() {
      let l = [];
      try { l = S.get("qr_a_revisar", "order=creado.asc", 0) || []; } catch (e) { return ""; }
      if (!l.length) return "";
      const nombre = e => { const f = global.Catalogo && Catalogo.buscar(e); return (f && (f.nombreCompleto || f.nombre)) || e; };
      return `<h4>A revisar (${l.length})</h4>${l.map(m => `
        <div class="dv-caso"><div class="dv-caso-h"><b>${esc(nombre(m.ean))}</b><span>${cant(m.cajas, m.sueltas)} · ${esc(m.quien)} · ${hora(m.creado)} · pedido ${esc(m.ref || "")}</span></div>
          <div class="dv-caso-a"><button type="button" class="dv-b" data-a="liberar" data-mov="${esc(m.id)}">Liberar a la venta</button>
            <button type="button" class="dv-b peligro" data-a="descartar" data-mov="${esc(m.id)}">Descartar</button></div></div>`).join("")}`;
    }

    /* ── Eventos ───────────────────────────────────────────────── */
    /* 25/10/2026: una acción que guarda algo bloquea su botón con «Guardando…» antes de ir a la
       base (antes no se veía nada hasta la respuesta) y los toques que quedaron encolados mientras
       guardaba —doble clic— se ignoran: podían caer en el botón de OTRO caso que quedó en el mismo
       lugar al redibujar. La base, además, hace cada operación una sola vez. */
    let procesando = false, finAccion = 0;
    raiz.addEventListener("click", e => {
      const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
      const a = b.dataset.a;
      /* Mientras guarda, o pegado al final (toque encolado), no se atiende NINGÚN botón: el segundo toque
         de un doble clic caía en lo que apareció en el mismo lugar (por ejemplo, «Ver pedido»). */
      if (procesando || Date.now() - finAccion < 350) return;
      if (ACCIONES_CON_EFECTO.includes(a)) {
        if (Date.now() - refrescadoAfuera < 1000) return aviso("ojo", "La lista cambió recién: revisá y volvé a tocar.");
        procesando = true;
        b.disabled = true; b.textContent = /^nc/.test(a) ? "Emitiendo nota…" : "Guardando…";
        setTimeout(() => {
          try { accion(b, a); }
          finally {
            procesando = false; finAccion = Date.now();
            /* Si terminó sin redibujar (se canceló o faltaba un dato), el botón vuelve a estar disponible. */
            if (b.isConnected && b.disabled) pintar();
          }
        }, 30);
        return;
      }
      accion(b, a);
    });
    function accion(b, a) {
      if (a === "buscar") { const v = raiz.querySelector("#dvCod").value; if (v.trim()) escanear(v); }
      if (a === "camara") return camara();
      if (a === "novedad") { ultimoToque = 0; return refrescarDeAfuera(true); }
      if (a === "vista") { vista = b.dataset.v; msg = null; pintar(); }
      if (a === "cerrar") { ped = null; limpiar(); msg = null; pintar(); }
      if (a === "abrir") abrirPedido(b.dataset.ped);
      if (a === "quitar") { cajas.splice(+b.dataset.i, 1); pintar(); }
      if (a === "reintentar" && opPend) { const o = opPend; operar(o, "Guardado."); }
      if (a === "sin-codigo") { sinCod.abierto = true; casoSel = null; pintar(); }
      if (a === "sin-codigo-caso") {
        /* Lo pendiente de ese caso, para confirmar contra el remito. */
        const c = (ped.casos || []).find(x => x.id === b.dataset.caso); if (!c) return;
        manual = {}; cajas = [];
        sinCod = { abierto: true, motivo: "", otro: "" }; casoSel = c.id;
        msg = { tipo: "info", txt: "Indicá qué llegó, con la mercadería adelante, y elegí el motivo." };
        pintar();
      }
      if (a === "recibir") {
        const items = itemsActuales();
        if (!items.length) return aviso("mal", "Escaneá el código de cada caja (o indicá qué volvió sin código).");
        const conManual = items.some(i => !i.bulto);
        if (conManual && !motivoTxt()) return aviso("mal", "Elegí por qué no tenés el código de la caja: queda registrado con la recepción.");
        const o = { tipo: "recepcion", items, entrada: entradaDe() };
        if (conManual) o.motivo_sin_codigo = motivoTxt();
        if (casoSel && !cajas.length) o.caso = casoSel;
        operar(o, "Recepción confirmada." + (emiteNota ? " Falta emitir la nota." : " La nota la emite Caja o Facturación."));
      }
      if (a === "recibir-distinto") {
        const motivo = String(motivoDif || "").trim();
        if (!motivo) return aviso("mal", "Contá en pocas palabras por qué llegó otra cosa: queda en el historial.");
        const items = itemsActuales();
        if (!items.length) return aviso("mal", "Escaneá la caja que llegó.");
        if (ocupado) return;
        const q = quien(); if (!q) return aviso("mal", "Falta quién lo hace.");
        ocupado = true;
        const cuerpo = { op, caso: b.dataset.caso, pedido_id: String(ped.pedido_id), items, motivo, quien: q, origen: modo, entrada: entradaDe() };
        let r;
